<title>Reverse Rethink Rebuild</title>
<style>
  :root {
    --ground: #F7F4EC;
    --paper: #FFFFFF;
    --soft: #FBF9F3;
    --sunk: #F1EDE1;
    --ink: #0D1B3D;
    --ink-soft: #3E4E76;
    --ink-mute: #7B87A5;
    --rule: #E3DCCA;
    --rule-hard: #D6CDB6;

    --sun: #FFC83D;
    --energy: #FF7A1A;
    --sky: #4DB6F2;
    --teal: #00B9A7;
    --purple: #7B5EA6;
    --rose: #E0526E;
    --green: #5FA63F;
    --navy: #0D1B3D;

    --shadow: 0 1px 2px rgba(13,27,61,.04), 0 10px 26px -16px rgba(13,27,61,.25);
    --shadow-lg: 0 3px 8px rgba(13,27,61,.07), 0 28px 56px -28px rgba(13,27,61,.4);

    --display: "Nunito", ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0A1730; --paper: #12234A; --soft: #16294F; --sunk: #1C3159;
      --ink: #F4F1E8; --ink-soft: #C7D2EC; --ink-mute: #8E9CBE;
      --rule: #26375F; --rule-hard: #35497A;
      --sun: #FFD264; --energy: #FF9247; --sky: #74C6F7; --teal: #1ACFBB;
      --purple: #A78BCE; --rose: #F0798F; --green: #7EC65C; --navy: #F4F1E8;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.8);
      --shadow-lg: 0 3px 8px rgba(0,0,0,.45), 0 30px 60px -30px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0A1730; --paper: #12234A; --soft: #16294F; --sunk: #1C3159;
    --ink: #F4F1E8; --ink-soft: #C7D2EC; --ink-mute: #8E9CBE;
    --rule: #26375F; --rule-hard: #35497A;
    --sun: #FFD264; --energy: #FF9247; --sky: #74C6F7; --teal: #1ACFBB;
    --purple: #A78BCE; --rose: #F0798F; --green: #7EC65C; --navy: #F4F1E8;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.8);
    --shadow-lg: 0 3px 8px rgba(0,0,0,.45), 0 30px 60px -30px rgba(0,0,0,.9);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); font-size: 1rem; line-height: 1.62; -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4 { font-family: var(--display); font-weight: 800; margin: 0; line-height: 1.12; letter-spacing: -.02em; text-wrap: balance; }
  p { margin: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; font-family: var(--body); }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 10px; }
  .ic { width: 1.2em; height: 1.2em; flex: none; }

  /* ---- top bar ---- */
  .bar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
    padding: .8rem clamp(1rem, 3vw, 2.2rem);
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
  }
  .logo { display: flex; align-items: center; gap: .55rem; margin-right: auto; }
  .logo svg { width: 28px; height: 39px; }
  .logo b { font-family: var(--display); font-weight: 800; font-size: .95rem; line-height: 1.05; display: block; }
  .logo span { font-size: .56rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--teal); }

  .stepdots { display: flex; gap: .35rem; }
  .sdot {
    width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center;
    border: 2px dashed var(--rule-hard); background: var(--paper); color: var(--ink-mute);
    transition: transform .3s cubic-bezier(.3,1.5,.5,1), border-color .25s ease;
  }
  .sdot .ic { width: 1.1rem; height: 1.1rem; }
  .sdot.on { border-style: solid; color: #fff; }
  .sdot.here { transform: scale(1.15); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sun) 40%, transparent); }

  .chipbtn {
    display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .9rem;
    border-radius: 99px; font-family: var(--display); font-weight: 800; font-size: .88rem;
    background: var(--paper); border: 2px solid var(--rule); box-shadow: var(--shadow);
    transition: transform .12s ease;
  }
  .chipbtn:hover { transform: translateY(-2px); }

  /* ---- layout ---- */
  .page { max-width: 60rem; margin: 0 auto; padding: clamp(1.4rem,3.4vw,2.8rem) clamp(1rem,3vw,2.2rem) 4rem; }
  .eyebrow { font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); }
  h1.big { font-size: clamp(2rem, 6.5vw, 3.6rem); margin-top: .6rem; }
  h1.big::after { content: ""; display: block; width: 4.5rem; height: 6px; border-radius: 99px; background: var(--sun); margin-top: 1rem; }
  .lede { color: var(--ink-soft); font-size: 1.08rem; margin-top: 1rem; max-width: 56ch; }

  .card { background: var(--paper); border: 1px solid var(--rule); border-radius: 22px; padding: 1.4rem 1.5rem; box-shadow: var(--shadow); }
  .card + .card { margin-top: 1rem; }
  .stack { display: grid; gap: 1rem; }
  .grid2 { display: grid; gap: 1rem; }
  @media (min-width: 50rem) { .grid2 { grid-template-columns: 1fr 1fr; } }

  .lbl { display: block; font-family: var(--display); font-weight: 800; font-size: 1rem; margin-bottom: .3rem; }
  .hint { color: var(--ink-mute); font-size: .86rem; }
  .fld { display: grid; gap: .35rem; }
  .fld + .fld { margin-top: 1rem; }
  input[type=text], input[type=number], textarea {
    width: 100%; padding: .7rem .9rem; border-radius: 13px;
    border: 2px solid var(--rule); background: var(--paper); resize: vertical; transition: border-color .15s ease;
  }
  input:focus, textarea:focus { border-color: var(--teal); outline: none; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    padding: .72rem 1.3rem; border-radius: 14px; font-family: var(--display); font-weight: 800; font-size: .96rem;
    background: var(--energy); color: #fff; box-shadow: var(--shadow); transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .btn.ghost { background: var(--paper); color: var(--ink); border: 2px solid var(--rule-hard); box-shadow: none; }
  .btn.sm { padding: .42rem .85rem; font-size: .85rem; border-radius: 11px; }

  .pagenav { display: flex; gap: .8rem; justify-content: space-between; margin-top: 2.6rem; flex-wrap: wrap; }

  /* ---- the four-step rail (the poster device) ---- */
  .steps4 { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(11rem,1fr)); align-items: start; }
  .s4 { display: grid; gap: .55rem; justify-items: center; text-align: center; position: relative; }
  .s4 .circ {
    width: 4.6rem; height: 4.6rem; border-radius: 50%; display: grid; place-items: center;
    color: #fff; box-shadow: var(--shadow); position: relative;
  }
  .s4 .circ .ic { width: 2.2rem; height: 2.2rem; }
  .s4 .pip {
    position: absolute; bottom: -.2rem; right: -.2rem; width: 1.6rem; height: 1.6rem; border-radius: 50%;
    background: var(--paper); color: var(--ink); border: 2px solid var(--rule);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: .74rem;
  }
  .s4 b { font-family: var(--display); font-weight: 800; font-size: .95rem; letter-spacing: .01em; text-transform: uppercase; }
  .s4 span { font-size: .84rem; color: var(--ink-soft); line-height: 1.4; }
  .s4 .dash {
    position: absolute; top: 2.2rem; left: calc(50% + 3.1rem); width: calc(100% - 6.2rem); height: 2px;
    border-top: 3px dashed var(--teal); opacity: .7;
  }
  @media (max-width: 43.9rem) { .s4 .dash { display: none; } }

  /* ---- worked examples ---- */
  .exgrid { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(13rem,1fr)); }
  .ex { border: 2px solid var(--rule); border-radius: 20px; padding: 1rem; background: var(--paper); text-align: left; transition: transform .14s ease, box-shadow .14s ease; }
  .ex:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .ex .top { display: flex; align-items: center; gap: .7rem; margin-bottom: .5rem; }
  .ex .circ { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 1.1rem; }
  .ex b { font-family: var(--display); font-weight: 800; font-size: 1rem; }
  .ex p { font-size: .85rem; color: var(--ink-mute); }

  .exdetail { display: grid; gap: .7rem; }
  .exrow { display: grid; grid-template-columns: 2.6rem minmax(0,1fr); gap: .8rem; align-items: start; }
  .exrow .circ { width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .exrow .circ .ic { width: 1.2rem; height: 1.2rem; }
  .exrow h4 { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-family: var(--body); font-weight: 800; color: var(--teal); }
  .exrow p { font-size: .94rem; }

  /* ---- lists with add/remove ---- */
  .rows { display: grid; gap: .4rem; }
  .row { display: grid; grid-template-columns: minmax(0,1fr) 2.2rem; gap: .5rem; align-items: center; }
  .row.dual { grid-template-columns: minmax(0,1fr) minmax(0,1fr) 2.2rem; }
  .icon-btn { width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--rule); color: var(--ink-mute); }
  .icon-btn:hover { color: var(--rose); border-color: var(--rose); }

  /* ---- question starters ---- */
  .starters { display: flex; flex-wrap: wrap; gap: .45rem; }
  .starter {
    padding: .45rem .95rem; border-radius: 99px; border: 2px solid var(--rule);
    background: var(--paper); font-family: var(--display); font-weight: 800; font-size: .88rem;
    transition: transform .12s ease;
  }
  .starter:hover { transform: translateY(-1px); border-color: var(--energy); color: var(--energy); }

  .qladder { display: grid; gap: .5rem; }
  .qpair { border: 2px solid var(--rule); border-radius: 18px; padding: .9rem 1rem; display: grid; gap: .6rem; }
  .qpair .weak, .qpair .better { display: grid; grid-template-columns: 5.6rem minmax(0,1fr); gap: .7rem; align-items: center; }
  .qpair .tagw, .qpair .tagb { font-size: .62rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; text-align: right; }
  .qpair .tagw { color: var(--ink-mute); }
  .qpair .tagb { color: var(--energy); }
  .qpair.best { border-color: var(--energy); background: color-mix(in srgb, var(--energy) 8%, var(--paper)); }
  @media (max-width: 34rem) { .qpair .weak, .qpair .better { grid-template-columns: minmax(0,1fr); gap: .15rem; } .qpair .tagw, .qpair .tagb { text-align: left; } }

  /* ---- lenses ---- */
  .lenses { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(13rem,1fr)); }
  .lens { border: 2px solid var(--rule); border-radius: 18px; padding: .8rem .9rem; display: grid; gap: .4rem; }
  .lens .lhead { display: flex; align-items: center; gap: .5rem; }
  .lens .dot { width: 1.5rem; height: 1.5rem; border-radius: 50%; }
  .lens b { font-family: var(--display); font-weight: 800; font-size: .92rem; }
  .lens.filled { border-color: var(--teal); background: color-mix(in srgb, var(--teal) 7%, var(--paper)); }

  /* ---- assumptions ---- */
  .atable { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .atable th { text-align: left; font-size: .62rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute); padding: .45rem .35rem; }
  .atable td { padding: .32rem .35rem; border-top: 1px solid var(--rule); }
  .scroll { overflow-x: auto; }
  .kg { display: flex; gap: .25rem; }
  .kg button { padding: .3rem .6rem; border-radius: 99px; border: 2px solid var(--rule); font-size: .72rem; font-weight: 800; font-family: var(--display); background: var(--paper); }
  .kg button[aria-pressed="true"][data-v="known"] { background: var(--teal); border-color: var(--teal); color: #fff; }
  .kg button[aria-pressed="true"][data-v="guess"] { background: var(--energy); border-color: var(--energy); color: #fff; }

  .verdict { border-radius: 18px; padding: 1rem 1.15rem; display: flex; gap: .7rem; align-items: flex-start; line-height: 1.55; }
  .verdict.good { background: color-mix(in srgb, var(--teal) 12%, var(--paper)); border: 2px solid color-mix(in srgb, var(--teal) 40%, var(--rule)); }
  .verdict.warn { background: color-mix(in srgb, var(--energy) 12%, var(--paper)); border: 2px solid color-mix(in srgb, var(--energy) 45%, var(--rule)); }
  .verdict.idle { background: var(--soft); border: 2px solid var(--rule); color: var(--ink-mute); }

  /* ---- before / after ---- */
  .ba { display: grid; gap: .8rem; }
  @media (min-width: 46rem) { .ba { grid-template-columns: 1fr auto 1fr; align-items: stretch; } }
  .bacol { border: 2px solid var(--rule); border-radius: 20px; padding: 1rem; display: grid; gap: .5rem; align-content: start; }
  .bacol.before { background: var(--soft); }
  .bacol.after { border-color: var(--teal); background: color-mix(in srgb, var(--teal) 7%, var(--paper)); }
  .bacol h4 { font-size: .68rem; letter-spacing: .13em; text-transform: uppercase; font-family: var(--body); font-weight: 800; }
  .bacol.before h4 { color: var(--ink-mute); }
  .bacol.after h4 { color: var(--teal); }
  .baarrow { display: grid; place-items: center; color: var(--teal); font-size: 1.6rem; }

  /* ---- canvas ---- */
  .canvas-shell { position: relative; border-radius: 20px; overflow: hidden; border: 3px dashed var(--rule-hard); background: var(--paper); touch-action: none; }
  canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }
  .canvas-empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: var(--ink-mute); font-family: var(--display); font-weight: 800; }
  .tools { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; margin-top: .7rem; }
  .swatch { width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 3px solid var(--paper); box-shadow: 0 0 0 2px var(--rule); transition: transform .12s ease; }
  .swatch:hover { transform: scale(1.1); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); transform: scale(1.14); }

  /* ---- report ---- */
  .bp { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fill, minmax(15rem,1fr)); }
  .bpc { border: 2px solid var(--rule); border-radius: 18px; padding: .9rem 1rem; background: var(--paper); }
  .bpc h4 { font-family: var(--body); font-size: .62rem; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-mute); font-weight: 800; margin-bottom: .35rem; }
  .bpc p { font-size: .92rem; }
  .bpc.empty { background: var(--soft); border-style: dashed; }
  .bpc.empty p { color: var(--ink-mute); font-style: italic; }

  .certificate {
    background: var(--paper); border: 8px solid var(--sun); border-radius: 28px;
    padding: clamp(1.8rem,5vw,3.2rem); text-align: center; display: grid; gap: 1rem; justify-items: center;
    box-shadow: var(--shadow-lg); margin-top: 1.4rem;
  }
  .certificate .eyebrow { color: var(--teal); }
  .certificate h2 { font-size: clamp(1.8rem,6vw,2.8rem); }
  .certificate .who { font-family: var(--display); font-weight: 900; font-size: clamp(1.4rem,5vw,2.2rem); color: var(--energy); border-bottom: 3px dotted var(--rule-hard); padding: .1rem 2rem .35rem; }
  .certificate .sig { display: flex; gap: 2.5rem; flex-wrap: wrap; justify-content: center; margin-top: .8rem; }
  .certificate .sig hr { border: 0; border-top: 2px solid var(--ink); margin: 0 0 .25rem; }
  .certificate .sig span { font-family: var(--display); font-weight: 800; font-size: .82rem; }
  .certificate .align { font-size: .74rem; color: var(--ink-mute); }

  .bandfoot {
    margin-top: 3rem; background: var(--navy); border-radius: 24px;
    padding: 1.3rem 1.6rem; display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; justify-content: center;
    font-family: var(--display); font-weight: 900; font-size: clamp(1.1rem, 3.4vw, 1.7rem);
  }
  .bandfoot i { font-style: normal; }

  .toasts { position: fixed; right: 1rem; bottom: 1rem; display: grid; gap: .5rem; z-index: 80; }
  .toast { background: var(--paper); border: 2px solid var(--rule); border-left: 6px solid var(--sun); border-radius: 16px; padding: .75rem 1rem; box-shadow: var(--shadow-lg); max-width: 20rem; animation: slide .3s cubic-bezier(.2,.9,.3,1); }
  .toast b { display: block; font-family: var(--display); font-weight: 800; font-size: .92rem; }
  .toast span { font-size: .78rem; color: var(--ink-mute); }
  @keyframes slide { from { opacity: 0; transform: translateX(16px) } }

  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
  .confetti i { position: absolute; width: 9px; height: 13px; border-radius: 2px; animation: fall 2.4s cubic-bezier(.3,.6,.5,1) forwards; }
  @keyframes fall { 0% { transform: translateY(-10vh) rotate(0); opacity: 1 } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0 } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  @media print { .bar, .pagenav, .noprint, .bandfoot { display: none !important } body { background: #fff } }

  /* ---- brand: gold rule with a centred star (from the brand board) ---- */
  .lf-div { display: flex; align-items: center; gap: .85rem; margin: 2.4rem 0; }
  .lf-div::before, .lf-div::after { content: ""; height: 2px; flex: 1; background: var(--sun); opacity: .55; border-radius: 2px; }
  .lf-div svg { width: 1.05rem; height: 1.05rem; color: var(--sun); flex: none; }
  .lf-div.short::before, .lf-div.short::after { max-width: 8rem; }

  /* ---- brand: quiet structural labels (the board sets these in muted, not accent) ---- */
  .lf-quiet { color: var(--ink-mute); }

  /* ---- brand: drifting graphic elements ---- */
  .lf-deco { position: absolute; pointer-events: none; opacity: .5; }

  /* Play-the-game link in the top bar */
  .lf-play{display:inline-flex;align-items:center;gap:.42rem;text-decoration:none;cursor:pointer;
    font:inherit;font-size:.78rem;font-weight:800;letter-spacing:.01em;
    padding:.42rem .8rem;border-radius:999px;white-space:nowrap;
    border:2px solid color-mix(in srgb,var(--sun) 60%,var(--rule,#DDD6C4));
    background:color-mix(in srgb,var(--sun) 18%,var(--paper));color:var(--ink)}
  .lf-play:hover{background:color-mix(in srgb,var(--sun) 34%,var(--paper))}
  .lf-play em{font-style:normal;font-size:.95rem;line-height:1}
</style>

<script>
/* ===================================================================
   Little Founders — student layer
   Every book stores one saved copy per student, so a shared classroom
   device carries a whole class. The roster is shared between books.
   =================================================================== */
window.LF = (function () {
  "use strict";

  var RKEY = "lf-roster-v1", AKEY = "lf-active-student-v1";
  var roster = [], active = null;
  var cfg = { book: "book", title: "This book", onSwitch: null, progress: null };

  function uid() { return "s" + Math.random().toString(36).slice(2, 9); }

  function readAll() {
    try { roster = JSON.parse(localStorage.getItem(RKEY) || "[]") || []; } catch (e) { roster = []; }
    if (!Array.isArray(roster)) roster = [];
    try { active = localStorage.getItem(AKEY); } catch (e) { active = null; }
    if (!roster.length) { var id = uid(); roster = [{ id: id, name: "" }]; active = id; persist(); }
    if (!roster.some(function (s) { return s.id === active; })) { active = roster[0].id; persist(); }
  }
  function persist() {
    try {
      localStorage.setItem(RKEY, JSON.stringify(roster));
      localStorage.setItem(AKEY, active);
    } catch (e) {}
  }

  function current() { return roster.filter(function (s) { return s.id === active; })[0] || roster[0]; }
  function label() { var s = current(); return (s && s.name && s.name.trim()) || "Unnamed student"; }
  function key(base) { return base + "::" + active; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* progress for one student in this book, 0–100 */
  function pctFor(id) {
    if (!cfg.progress) return null;
    try {
      var raw = localStorage.getItem(cfg.book + "::" + id);
      if (!raw) return 0;
      var v = cfg.progress(JSON.parse(raw));
      return Math.max(0, Math.min(100, Math.round(v || 0)));
    } catch (e) { return 0; }
  }

  /* ------------------------------------------------------------- styles */
  function injectCSS() {
    if (document.getElementById("lf-student-css")) return;
    var css = document.createElement("style");
    css.id = "lf-student-css";
    css.textContent = [
      ".lf-who{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .55rem .4rem .4rem;border-radius:99px;",
      "border:2px solid var(--rule,#E3DCCA);background:var(--paper,#fff);font-family:var(--display,system-ui);",
      "font-weight:800;font-size:.86rem;cursor:pointer;transition:transform .12s ease}",
      ".lf-who:hover{transform:translateY(-1px)}",
      ".lf-who .lf-av{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;",
      "background:var(--energy,#FF7A1A);color:#fff;font-size:.8rem;flex:none}",
      ".lf-who .lf-caret{opacity:.5;font-size:.7rem}",
      ".lf-scrim{position:fixed;inset:0;background:rgba(13,27,61,.55);z-index:200;display:grid;place-items:center;padding:1rem;",
      "animation:lfFade .2s ease}",
      "@keyframes lfFade{from{opacity:0}}",
      ".lf-panel{background:var(--paper,#fff);color:var(--ink,#0D1B3D);border-radius:22px;max-width:34rem;width:100%;",
      "max-height:86vh;overflow:auto;padding:1.4rem 1.5rem;box-shadow:0 30px 70px -30px rgba(0,0,0,.7);",
      "border:1px solid var(--rule,#E3DCCA);font-family:var(--body,system-ui)}",
      ".lf-panel h2{font-family:var(--display,system-ui);font-weight:800;font-size:1.3rem;margin:0 0 .2rem}",
      ".lf-panel .lf-sub{color:var(--ink-mute,#7B87A5);font-size:.86rem;margin-bottom:1.1rem}",
      ".lf-row{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto auto;gap:.6rem;align-items:center;",
      "padding:.5rem;border-radius:14px;border:2px solid var(--rule,#E3DCCA);margin-bottom:.45rem}",
      ".lf-row.on{border-color:var(--teal,#00B9A7);background:color-mix(in srgb,var(--teal,#00B9A7) 8%,transparent)}",
      ".lf-row .lf-av{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;color:#fff;",
      "font-family:var(--display,system-ui);font-weight:800;font-size:.9rem}",
      ".lf-row input{width:100%;border:0;background:none;font:inherit;font-family:var(--display,system-ui);font-weight:700;",
      "color:inherit;padding:.2rem 0}",
      ".lf-row input:focus{outline:none;border-bottom:2px solid var(--teal,#00B9A7)}",
      ".lf-bar{width:4.5rem;height:8px;border-radius:99px;background:var(--sunk,#EEE9DA);overflow:hidden;flex:none}",
      ".lf-bar i{display:block;height:100%;background:var(--teal,#00B9A7);border-radius:99px}",
      ".lf-pct{font-size:.72rem;color:var(--ink-mute,#7B87A5);font-variant-numeric:tabular-nums;min-width:2.4rem;text-align:right}",
      ".lf-mini{display:flex;align-items:center;gap:.4rem}",
      ".lf-x{width:1.9rem;height:1.9rem;border-radius:50%;border:2px solid var(--rule,#E3DCCA);display:grid;place-items:center;",
      "background:none;cursor:pointer;color:var(--ink-mute,#7B87A5);font-size:.9rem;line-height:1}",
      ".lf-x:hover{color:#D0455C;border-color:#D0455C}",
      ".lf-acts{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}",
      ".lf-btn{padding:.6rem 1.1rem;border-radius:13px;font-family:var(--display,system-ui);font-weight:800;font-size:.9rem;",
      "border:0;cursor:pointer;background:var(--energy,#FF7A1A);color:#fff}",
      ".lf-btn.ghost{background:transparent;color:inherit;border:2px solid var(--rule,#E3DCCA)}",
      ".lf-note{font-size:.8rem;color:var(--ink-mute,#7B87A5);margin-top:1rem;line-height:1.5}"
    ].join("");
    document.head.appendChild(css);
  }

  /* ------------------------------------------------------------- chip */
  var chip;
  function paintChip() {
    if (!chip) return;
    var n = label();
    chip.innerHTML = '<span class="lf-av">' + esc(n.trim().charAt(0).toUpperCase() || "?") + "</span>" +
      "<span>" + esc(n) + '</span><span class="lf-caret">▾</span>';
    chip.setAttribute("aria-label", "Current student: " + n + ". Change student.");
  }
  function mountChip() {
    var host = document.querySelector(".bar, .topline");
    if (!host) return;
    chip = document.createElement("button");
    chip.className = "lf-who";
    chip.type = "button";
    chip.addEventListener("click", openPanel);
    host.appendChild(chip);
    paintChip();
  }

  /* ------------------------------------------------------------- panel */
  function openPanel() {
    var scrim = document.createElement("div");
    scrim.className = "lf-scrim";
    var panel = document.createElement("div");
    panel.className = "lf-panel";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-label", "Choose student");
    scrim.appendChild(panel);

    function draw() {
      var cols = ["#FF7A1A", "#00B9A7", "#4DB6F2", "#7B5EA6", "#5FA63F", "#E0526E", "#FFC83D"];
      panel.innerHTML = "<h2>Who is using this?</h2>" +
        '<p class="lf-sub">' + esc(cfg.title) + " keeps a separate copy of the work for every student on this device.</p>";

      roster.forEach(function (s, i) {
        var row = document.createElement("div");
        row.className = "lf-row" + (s.id === active ? " on" : "");

        var av = document.createElement("span");
        av.className = "lf-av";
        av.style.background = cols[i % cols.length];
        av.textContent = (s.name || "?").trim().charAt(0).toUpperCase() || "?";
        row.appendChild(av);

        var nameWrap = document.createElement("div");
        var input = document.createElement("input");
        input.type = "text";
        input.value = s.name || "";
        input.placeholder = "Student name";
        input.setAttribute("aria-label", "Student name");
        input.addEventListener("input", function () {
          s.name = input.value.slice(0, 40); persist(); paintChip();
          av.textContent = (s.name || "?").trim().charAt(0).toUpperCase() || "?";
        });
        nameWrap.appendChild(input);
        row.appendChild(nameWrap);

        var pct = pctFor(s.id);
        var mini = document.createElement("div");
        mini.className = "lf-mini";
        if (pct !== null) {
          mini.innerHTML = '<span class="lf-bar"><i style="width:' + pct + '%"></i></span>' +
            '<span class="lf-pct">' + pct + "%</span>";
        }
        row.appendChild(mini);

        var right = document.createElement("div");
        right.className = "lf-mini";
        if (s.id !== active) {
          var use = document.createElement("button");
          use.className = "lf-btn ghost";
          use.style.padding = ".35rem .8rem";
          use.style.fontSize = ".8rem";
          use.textContent = "Use";
          use.addEventListener("click", function () {
            active = s.id; persist(); paintChip();
            if (cfg.onSwitch) cfg.onSwitch();
            close();
          });
          right.appendChild(use);
        }
        if (roster.length > 1) {
          var del = document.createElement("button");
          del.className = "lf-x";
          del.type = "button";
          del.innerHTML = "✕";
          del.setAttribute("aria-label", "Remove " + (s.name || "student") + " and their work");
          del.addEventListener("click", function () {
            if (!confirm("Remove " + (s.name || "this student") + "? Their saved work in every book is deleted and cannot be recovered.")) return;
            try {
              for (var k = localStorage.length - 1; k >= 0; k--) {
                var kk = localStorage.key(k);
                if (kk && kk.indexOf("::" + s.id) > -1) localStorage.removeItem(kk);
              }
            } catch (e) {}
            roster = roster.filter(function (x) { return x.id !== s.id; });
            if (active === s.id) { active = roster[0].id; if (cfg.onSwitch) cfg.onSwitch(); }
            persist(); paintChip(); draw();
          });
          right.appendChild(del);
        }
        row.appendChild(right);
        panel.appendChild(row);
      });

      var acts = document.createElement("div");
      acts.className = "lf-acts";
      var add = document.createElement("button");
      add.className = "lf-btn";
      add.textContent = "+ Add a student";
      add.addEventListener("click", function () {
        var id = uid();
        roster.push({ id: id, name: "" });
        active = id; persist(); paintChip();
        if (cfg.onSwitch) cfg.onSwitch();
        draw();
      });
      var done = document.createElement("button");
      done.className = "lf-btn ghost";
      done.textContent = "Done";
      done.addEventListener("click", close);
      acts.appendChild(add); acts.appendChild(done);
      panel.appendChild(acts);

      var note = document.createElement("p");
      note.className = "lf-note";
      note.textContent = "The class list is shared across all four Little Founders books, so a student keeps the same name everywhere. " +
        "Work is saved in this browser only — it does not follow a student to another device.";
      panel.appendChild(note);
    }

    function close() { scrim.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e) { if (e.key === "Escape") close(); }
    scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
    document.addEventListener("keydown", onKey);

    draw();
    document.body.appendChild(scrim);
    var f = panel.querySelector("input");
    if (f && !f.value) f.focus();
  }

  /* ------------------------------------------------------------- api */
  function init(options) {
    cfg = Object.assign(cfg, options || {});
    readAll();
    injectCSS();
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mountChip);
    else mountChip();
  }

  return {
    init: init,
    key: key,
    name: label,
    activeId: function () { return active; },
    roster: function () { return roster.slice(); },
    open: openPanel,
    refresh: function () { paintChip(); }
  };
})();
</script>

<script>
(() => {

  const STEPS = [

  const STARTERS = [

  const LENSES = [

    ["Stronger", "energy", "Make the weak point the strong point"],
    ["Cheaper", "sky", "Same job, less money — for them or for you"],

    ["Kinder", "green", "Better for people, animals, or the planet"],
    ["For someone else", "purple", "Redesign it for a person it currently fails"]
  ];

  const EXAMPLES = [
    { id:"backpack", em:"🎒", name:"A school backpack", colour:"sun",
      observe:"Two straps, one big pocket, a small front pocket, a mesh side pocket, a zip that runs over the top. The weight sits low, below the shoulder blades.",
      ask:"Why does everything have to go in one big pocket? Who decided the water bottle goes on the outside where it falls out?",
      rethink:"Simpler lens: two half-height compartments instead of one deep one, so books stop sliding to the bottom. Kinder lens: a strap that spreads weight across the hips, because Grade 7 bags are heavy enough to hurt.",
      rebuild:"A split-level bag with a firm shelf halfway down and a bottle pocket that sits inside the frame. Before: everything at the bottom, bottle falls out. After: heavy things at shoulder height, nothing falls." },
    { id:"bottle", em:"🍶", name:"A water bottle", colour:"sky",
      observe:"Screw lid, wide mouth, straight sides, a plastic loop for a finger. Fits a cup holder. The lid unscrews all the way off, so you have to hold it.",
      ask:"Why does the lid come completely off? What happens to the lid when your hands are full — which is exactly when you are drinking?",
      rethink:"Simpler lens: hinge the lid so it never leaves the bottle. For-someone-else lens: someone with one working hand cannot open this at all.",
      rebuild:"A hinged lid with a one-thumb catch. Before: two hands and somewhere to put the lid. After: one thumb, lid stays attached." },
    { id:"busstop", em:"🚏", name:"A bus stop", colour:"teal",
      observe:"A pole, a sign with a timetable, a bench facing the road, a shelter open on one side. The open side faces the wind. The timetable is printed at adult eye height.",
      ask:"Why is the shelter open on the windy side? Who is the bench height designed for? What does a person do here who cannot read the timetable?",
      rethink:"For-someone-else lens: a younger child, a person using a wheelchair, someone who reads a different language. Simpler lens: replace the timetable with 'next bus in ___ minutes'.",
      rebuild:"Shelter turned 90°, a countdown instead of a timetable, and the information repeated at two heights. Before: you must be tall, sighted, and a confident reader. After: you must be none of those." },
    { id:"lunch", em:"🍽", name:"The lunch queue", colour:"purple",
      observe:"One queue, one till, hot food at the end, drinks at the start. People stop at the drinks fridge and block everyone behind them. The queue is longest at 12:05.",
      ask:"Why is the fridge at the start? Why does everyone arrive at the same minute? What is the actual bottleneck — the food or the paying?",
      rethink:"Simpler lens: move drinks past the till. Lighter lens: pre-order removes a whole decision from the queue. Cheaper lens: a second till costs money; moving a fridge costs nothing.",
      rebuild:"Fridge moved past the till, and one year group released two minutes early. Before: 14-minute queue. After: the bottleneck moves to the till, which is the thing worth measuring next." }
  ];

  const INK = ["#0D1B3D", "#FF7A1A", "#4DB6F2", "#00B9A7", "#FFC83D", "#7B5EA6", "#E0526E"];

  /* ===================== state ===================== */

  const KEY = "lf-reverse-rethink-rebuild-v1";
  const fresh = () => ({
    name: "", object: "", why: "",
    parts: [], works: "", noticed: [],
    questions: [], bestQ: "",
    lenses: {}, assumptions: [], test: { what:"", threshold:"", result:"" },
    before: "", after: "", changed: "", helps: "",
    drawing: "", stamps: {}
  });
  let D = fresh();
  function save() { try { localStorage.setItem(LF.key(KEY), JSON.stringify(D)); } catch (e) {} }
  function load() { try { const r = localStorage.getItem(LF.key(KEY)); if (r) D = Object.assign(fresh(), JSON.parse(r)); } catch (e) {} }

  /* ===================== helpers ===================== */

  const $ = id => document.getElementById(id);
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const ic = id => '<svg class="ic" aria-hidden="true"><use href="#' + id + '"/></svg>';
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const filled = s => String(s || "").trim().length > 1;
  const paint = c => "background:var(--" + c + ")";

  function toast(t, b) {
    const n = el("div", "toast", "<b>" + esc(t) + "</b><span>" + esc(b) + "</span>");
    $("toasts").appendChild(n);
    setTimeout(() => { n.style.transition = "opacity .3s"; n.style.opacity = "0"; setTimeout(() => n.remove(), 320); }, 3600);
  }
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const box = el("div", "confetti");
    const cols = ["#FFC83D","#FF7A1A","#4DB6F2","#00B9A7","#7B5EA6"];
    for (let i = 0; i < 60; i++) {
      const p = document.createElement("i");
      p.style.left = (Math.random() * 100) + "vw";
      p.style.background = cols[i % cols.length];
      p.style.animationDelay = (Math.random() * .5) + "s";
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 3200);
  }

  function bind(node, get, set) {
    node.value = get() || "";
    node.addEventListener("input", () => { set(node.value); save(); checkStamps(); });
    return node;
  }
  function field(label, hint, get, set, opts) {
    opts = opts || {};
    const f = el("div", "fld");
    const id = "f" + Math.random().toString(36).slice(2, 8);
    f.innerHTML = '<label class="lbl" for="' + id + '">' + esc(label) + '</label>' + (hint ? '<span class="hint">' + esc(hint) + '</span>' : "");
    const i = document.createElement(opts.area ? "textarea" : "input");
    i.id = id;
    if (opts.area) i.rows = opts.rows || 2; else i.type = "text";
    if (opts.placeholder) i.placeholder = opts.placeholder;
    bind(i, get, set);
    f.appendChild(i);
    return f;
  }

  function listEditor(host, arr, placeholder, onChange, dual) {
    const rows = el("div", "rows");
    arr.forEach((item, i) => {
      const r = el("div", "row" + (dual ? " dual" : ""));
      const a = document.createElement("input");
      a.type = "text"; a.placeholder = placeholder;
      bind(a, () => (dual ? item.a : item), x => { if (dual) item.a = x; else arr[i] = x; onChange && onChange(); });
      r.appendChild(a);
      if (dual) {
        const b = document.createElement("input");
        b.type = "text"; b.placeholder = dual;
        bind(b, () => item.b, x => { item.b = x; onChange && onChange(); });
        r.appendChild(b);
      }
      const x = el("button", "icon-btn", ic("i-x"));
      x.setAttribute("aria-label", "Remove");
      x.addEventListener("click", () => { arr.splice(i, 1); save(); render(); });
      r.appendChild(x);
      rows.appendChild(r);
    });
    host.appendChild(rows);
    const add = el("button", "btn ghost sm", ic("i-plus") + "Add");

  /* ===================== stamps ===================== */

  function stampState() {
    return {
      observe: filled(D.object) && D.parts.filter(filled).length >= 3 && filled(D.works),
      ask: D.questions.filter(q => filled(q.b)).length >= 3 && filled(D.bestQ),
      rethink: Object.keys(D.lenses).filter(k => filled(D.lenses[k])).length >= 3 &&
               D.assumptions.filter(a => filled(a.text)).length >= 2 && filled(D.test.threshold),
      rebuild: filled(D.before) && filled(D.after) && filled(D.changed) && filled(D.helps)
    };
  }
  function checkStamps() {
    const s = stampState();
    let gained = null;
    STEPS.forEach(st => {
      if (s[st.id] && !D.stamps[st.id]) { D.stamps[st.id] = 1; gained = st.title; }
      if (!s[st.id] && D.stamps[st.id]) delete D.stamps[st.id];
    });
    save();
    paintDots();
    if (gained) { toast(gained + " complete", "Step badge earned."); confetti(); }
  }
  function paintDots() {
    const host = $("stepdots");

  /* ===================== drawing pad ===================== */

  function makePad(host, w, h) {
    const shell = el("div", "canvas-shell");
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.setAttribute("role", "img");
    cv.setAttribute("aria-label", "Sketch your rebuild");
    shell.appendChild(cv);
    const empty = el("div", "canvas-empty", "Sketch your rebuild here");
    shell.appendChild(empty);
    const ctx = cv.getContext("2d");
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    let colour = INK[0], drawing = false;
    const undo = [];
    function bg() { ctx.save(); ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, w, h); ctx.restore(); }
    bg();
    if (D.drawing) {
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, 0, 0, w, h); empty.style.display = "none"; };
      img.src = D.drawing;
    }
    const pos = e => { const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) * (w / r.width), y:(e.clientY - r.top) * (h / r.height) }; };
    const persist = () => { try { D.drawing = cv.toDataURL("image/png"); save(); } catch (e) {} };
    cv.addEventListener("pointerdown", e => {
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      try { undo.push(cv.toDataURL()); if (undo.length > 10) undo.shift(); } catch (er) {}
      drawing = true; empty.style.display = "none";
      const p = pos(e);
      ctx.strokeStyle = colour; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + .01, p.y); ctx.stroke();
    });
    cv.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    const end = () => { if (!drawing) return; drawing = false; persist(); };
    ["pointerup","pointercancel","pointerleave"].forEach(ev => cv.addEventListener(ev, end));

    const tools = el("div", "tools");
    INK.forEach((cRaw, i) => {
      const b = el("button", "swatch");
      b.style.background = cRaw;
      b.setAttribute("aria-label", "Colour " + (i + 1));
      b.setAttribute("aria-pressed", String(i === 0));
      b.addEventListener("click", () => {
        colour = cRaw;
        tools.querySelectorAll(".swatch").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
      });
      tools.appendChild(b);
    });
    const u = el("button", "chipbtn", ic("i-undo") + "Undo");
    u.addEventListener("click", () => {
      const prev = undo.pop(); if (!prev) return;
      const img = new Image();
      img.onload = () => { ctx.clearRect(0,0,w,h); bg(); ctx.drawImage(img, 0, 0, w, h); persist(); };
      img.src = prev;
    });
    const cl = el("button", "chipbtn", ic("i-trash") + "Clear");
    cl.addEventListener("click", () => { ctx.clearRect(0,0,w,h); bg(); empty.style.display = "grid"; D.drawing = ""; save(); });
    tools.appendChild(u); tools.appendChild(cl);
    host.appendChild(shell); host.appendChild(tools);
  }

      ["Who it helps", D.helps]
    ];
    const g = el("div", "bp");
    g.style.marginTop = "1.4rem";
    items.forEach(([k, val]) => g.appendChild(el("div", "bpc" + (filled(val) ? "" : " empty"),
      "<h4>" + esc(k) + "</h4><p>" + esc(filled(val) ? val : "Not filled in yet") + "</p>")));
    p.appendChild(g);

    if (D.drawing) {
      const fig = el("figure", "card");
      fig.style.marginTop = "1rem";
      fig.innerHTML = '<span class="lbl">My rebuild sketch</span>' +
        '<img alt="My rebuild sketch" src="' + D.drawing + '" style="width:100%;border-radius:16px;border:2px solid var(--rule);margin-top:.7rem">';
      p.appendChild(fig);
    }

    const done = STEPS.every(s => D.stamps[s.id]);
    if (done) {
      const cert = el("div", "certificate");
      const today = new Date().toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
      cert.innerHTML =
        '<p class="eyebrow">Little Founders · Young Founders · Ages 11–13</p>' +
        '<p class="eyebrow" style="letter-spacing:.2em">Certificate of</p><h2>Idea Builder</h2>' +
        '<p>Awarded to</p><p class="who">' + esc(D.name || "…………………") + '</p>' +
        '<p>who took ' + esc(D.object || "something ordinary") + ' apart, asked a question nobody had bothered to ask, tested a belief against a number set in advance, and rebuilt it better.</p>' +
        '<div class="sig"><div><hr><span>Guide</span></div><div><hr><span>' + esc(today) + '</span></div></div>' +
        '<p style="font-family:var(--display);font-weight:800">Proud of your curiosity. Ready to build a better future.</p>' +
        '<p class="align">Question. Rethink. Improve. Create.</p>';
      p.appendChild(cert);
    } else {
      const left = el("div", "card");
      left.style.marginTop = "1rem";
      left.innerHTML = '<span class="lbl">Still to finish</span>';
      const s = stampState();
      const ul = el("div", "rows");
      ul.style.marginTop = ".7rem";
      STEPS.forEach(st => {
        if (s[st.id]) return;
        const b = el("button", "btn ghost sm");
        b.style.justifyContent = "flex-start";
        b.innerHTML = ic(st.icon) + st.title;
        b.addEventListener("click", () => go(st.id));
        ul.appendChild(b);
      });
      left.appendChild(ul);
      p.appendChild(left);
    }

    const pr = el("button", "btn ghost noprint", ic("i-print") + "Print my report");
    pr.style.marginTop = "1.2rem";
    pr.addEventListener("click", () => window.print());
    p.appendChild(pr);
  }

  /* ===================== render ===================== */

  function render() {
    const p = $("page");
    p.innerHTML = "";
    ({ start:vStart, observe:vObserve, ask:vAsk, rethink:vRethink, rebuild:vRebuild, report:vReport }[cur] || vStart)(p);
    pagenav(p);
  }

  document.addEventListener("click", e => {
    const n = e.target.closest("[data-nav]");
    if (n) go(n.dataset.nav);
  });

  LF.init({book:KEY,title:"Reverse. Rethink. Rebuild.",progress:function(d){var s=Object.keys(d.stamps||{}).length;return s/4*100;},
    onSwitch:function(){ D = fresh(); load(); cur="start"; paintDots(); render(); }});
  load();
  paintDots();
  render();
})();
</script>
