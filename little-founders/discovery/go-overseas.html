<title>GO OVERSEAS Brand Builder</title>
<style>
  :root {
    --ground: #F7F4EC;
    --paper: #FFFFFF;
    --soft: #FBF9F3;
    --sunk: #F1EDE1;
    --ink: #0D1B3D;
    --ink-soft: #3E4E76;
    --ink-mute: #7B87A5;
    --rule: #E3DCCA;
    --rule-hard: #D6CDB6;

    --sun: #FFC83D;
    --energy: #FF7A1A;
    --sky: #4DB6F2;
    --teal: #00B9A7;
    --rose: #E0526E;
    --purple: #7B5EA6;
    --green: #5FA63F;
    --navy: #0D1B3D;

    --ok: #14966B;
    --warn: #C2761B;
    --bad: #D0455C;

    --shadow: 0 1px 2px rgba(13,27,61,.04), 0 10px 26px -16px rgba(13,27,61,.25);
    --shadow-lg: 0 3px 8px rgba(13,27,61,.07), 0 28px 56px -28px rgba(13,27,61,.4);

    --display: "Nunito", ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0A1730; --paper: #12234A; --soft: #16294F; --sunk: #1C3159;
      --ink: #F4F1E8; --ink-soft: #C7D2EC; --ink-mute: #8E9CBE;
      --rule: #26375F; --rule-hard: #35497A;
      --sun: #FFD264; --energy: #FF9247; --sky: #74C6F7; --teal: #1ACFBB;
      --rose: #F0798F; --purple: #A78BCE; --green: #7EC65C; --navy: #F4F1E8;
      --ok: #3FCB8E; --warn: #F0A947; --bad: #F4778C;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.8);
      --shadow-lg: 0 3px 8px rgba(0,0,0,.45), 0 30px 60px -30px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0A1730; --paper: #12234A; --soft: #16294F; --sunk: #1C3159;
    --ink: #F4F1E8; --ink-soft: #C7D2EC; --ink-mute: #8E9CBE;
    --rule: #26375F; --rule-hard: #35497A;
    --sun: #FFD264; --energy: #FF9247; --sky: #74C6F7; --teal: #1ACFBB;
    --rose: #F0798F; --purple: #A78BCE; --green: #7EC65C; --navy: #F4F1E8;
    --ok: #3FCB8E; --warn: #F0A947; --bad: #F4778C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.8);
    --shadow-lg: 0 3px 8px rgba(0,0,0,.45), 0 30px 60px -30px rgba(0,0,0,.9);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); font-size: 1rem; line-height: 1.62;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4 { font-family: var(--display); font-weight: 800; margin: 0; line-height: 1.12; letter-spacing: -.02em; text-wrap: balance; }
  p { margin: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; font-family: var(--body); }
  input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 10px; }
  .ic { width: 1.2em; height: 1.2em; flex: none; }

  /* ================ shell ================ */

  .app { display: grid; grid-template-columns: 17.5rem minmax(0,1fr); min-height: 100vh; }

  .rail {
    background: var(--paper); border-right: 1px solid var(--rule);
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding: 1.3rem 1rem 2rem; display: flex; flex-direction: column; gap: 1.2rem;
  }
  .brandmark { display: flex; align-items: center; gap: .6rem; padding: 0 .3rem; }
  .brandmark svg { width: 30px; height: 42px; }
  .brandmark b { font-family: var(--display); font-weight: 800; font-size: 1rem; line-height: 1.05; display: block; }
  .brandmark span { font-size: .58rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); }

  .passport-mini { display: grid; grid-template-columns: repeat(5, 1fr); gap: .35rem; }
  .pmini {
    aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: .9rem;
    background: var(--sunk); border: 2px dashed var(--rule-hard); opacity: .5; filter: grayscale(.7);
    transition: opacity .3s ease, filter .3s ease, transform .45s cubic-bezier(.3,1.5,.5,1);
  }
  .pmini.got { opacity: 1; filter: none; border-style: solid; border-color: var(--sun); background: color-mix(in srgb, var(--sun) 24%, var(--paper)); transform: rotate(-5deg); }

  .steps-nav { display: grid; gap: .12rem; }
  .snav {
    display: grid; grid-template-columns: 1.6rem minmax(0,1fr); gap: .6rem; align-items: baseline;
    padding: .52rem .6rem; border-radius: 12px; text-align: left; width: 100%;
    color: var(--ink-soft); font-size: .88rem;
  }
  .snav:hover { background: var(--sunk); color: var(--ink); }
  .snav[aria-current="step"] { background: color-mix(in srgb, var(--sun) 26%, var(--paper)); color: var(--ink); font-weight: 700; }
  .snav i { font-style: normal; font-size: .66rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-mute); }
  .snav[aria-current="step"] i { color: var(--energy); }
  .snav.done i::after { content: " ✓"; color: var(--teal); }

  main { min-width: 0; display: flex; flex-direction: column; }
  .topline {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: .9rem; flex-wrap: wrap;
    padding: .8rem clamp(1rem, 3vw, 2.6rem);
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
  }
  .menu-btn { display: none; }
  .topline .where { font-size: .72rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--teal); margin-right: auto; }
  .prog { height: 8px; width: 8rem; background: var(--sunk); border-radius: 99px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--sun); border-radius: 99px; transition: width .5s cubic-bezier(.3,.9,.3,1); }

  .view { padding: clamp(1.4rem, 3.4vw, 3rem) clamp(1rem, 3vw, 2.6rem) 5rem; max-width: 62rem; }

  .part-tag {
    display: inline-block; font-size: .72rem; font-weight: 800; letter-spacing: .14em;
    text-transform: uppercase; color: var(--teal); margin-bottom: .8rem;
  }
  .view > h1 { font-size: clamp(2rem, 5.5vw, 3.2rem); }
  .view > h1 + .lede::before,
  .view > h1::after {
    content: ""; display: block; width: 4.5rem; height: 6px; border-radius: 99px;
    background: var(--sun); margin: .9rem 0 0;
  }
  .view > h1 + .lede::before { display: none; }
  .view > .lede { color: var(--ink-soft); font-size: 1.08rem; margin-top: 1rem; max-width: 56ch; }

  .ch { margin-top: 2.6rem; }
  .ch-head { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; margin-bottom: .5rem; }
  .ch-head h2 { font-size: 1.5rem; }
  .ch-num { font-size: .68rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: var(--energy); }
  .ch > .sub { color: var(--ink-soft); margin-bottom: 1.1rem; max-width: 58ch; }

  .card { background: var(--paper); border: 1px solid var(--rule); border-radius: 22px; padding: 1.4rem 1.5rem; box-shadow: var(--shadow); }
  .card + .card { margin-top: 1rem; }
  .grid2 { display: grid; gap: 1rem; }
  @media (min-width: 52rem) { .grid2 { grid-template-columns: 1fr 1fr; } }

  .lbl { display: block; font-family: var(--display); font-weight: 800; font-size: 1rem; margin-bottom: .3rem; }
  .hint { color: var(--ink-mute); font-size: .85rem; }
  .fld { display: grid; gap: .35rem; }
  .fld + .fld { margin-top: 1rem; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: .7rem .9rem; border-radius: 13px;
    border: 2px solid var(--rule); background: var(--paper); resize: vertical;
    transition: border-color .15s ease;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--teal); outline: none; }
  input[type=number] { font-variant-numeric: tabular-nums; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    padding: .7rem 1.3rem; border-radius: 14px; font-family: var(--display); font-weight: 800; font-size: .95rem;
    background: var(--energy); color: #fff; box-shadow: var(--shadow);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .btn.ghost { background: var(--paper); color: var(--ink); border: 2px solid var(--rule-hard); box-shadow: none; }
  .btn.sm { padding: .42rem .85rem; font-size: .85rem; border-radius: 11px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .pagenav { display: flex; gap: .8rem; justify-content: space-between; margin-top: 2.8rem; flex-wrap: wrap; }

  /* star divider */
  .stardiv { display: flex; align-items: center; gap: .8rem; margin: 2.2rem 0; color: var(--rule-hard); }
  .stardiv::before, .stardiv::after { content: ""; height: 2px; background: var(--rule); flex: 1; border-radius: 2px; }
  .stardiv span { color: var(--sun); font-size: 1.1rem; }

  /* ---- name storm ---- */
  .nametable { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .nametable th { text-align: left; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute); padding: .45rem .3rem; font-weight: 800; }
  .nametable td { padding: .3rem .3rem; border-top: 1px solid var(--rule); }
  .nametable input[type=text] { padding: .45rem .6rem; }
  .score { display: flex; gap: .15rem; }
  .score button { width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 2px solid var(--rule); font-size: .72rem; font-weight: 800; background: var(--paper); }
  .score button[aria-pressed="true"] { background: var(--teal); color: #fff; border-color: var(--teal); }
  .total { font-weight: 800; font-variant-numeric: tabular-nums; font-family: var(--display); }
  .winner { background: color-mix(in srgb, var(--sun) 18%, transparent); }

  /* ---- colours ---- */
  .hues { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem,1fr)); gap: .6rem; }
  .hue { border: 2px solid var(--rule); border-radius: 18px; overflow: hidden; text-align: left; background: var(--paper); }
  .hue .chip { height: 2.8rem; }
  .hue .meta { padding: .5rem .7rem .6rem; }
  .hue b { display: block; font-size: .85rem; font-family: var(--display); font-weight: 800; }
  .hue span { font-size: .72rem; color: var(--ink-mute); }
  .hue[aria-pressed="true"] { border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 30%, transparent); }

  .slots { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(9rem,1fr)); }
  .slot { border: 2px solid var(--rule); border-radius: 18px; padding: .7rem; display: grid; gap: .45rem; }
  .slot .sw { height: 3.2rem; border-radius: 50%; border: 2px solid var(--rule); }
  .slot label { font-size: .64rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute); }
  .slot input[type=color] { width: 100%; height: 2.1rem; padding: 0; border: 2px solid var(--rule); border-radius: 9px; background: none; }

  /* ---- brand preview ---- */
  .preview { border-radius: 22px; overflow: hidden; border: 1px solid var(--rule-hard); box-shadow: var(--shadow-lg); }
  .pv-top { padding: 1.8rem 1.6rem; display: grid; gap: .9rem; }
  .pv-logo { display: flex; align-items: center; gap: .8rem; }
  .pv-mark { width: 3.2rem; height: 3.2rem; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 1.35rem; }
  .pv-name { font-weight: 800; font-size: 1.6rem; line-height: 1.05; letter-spacing: -.02em; }
  .pv-tag { font-size: .95rem; opacity: .85; }
  .pv-cta { display: inline-flex; align-self: flex-start; padding: .6rem 1.2rem; border-radius: 14px; font-weight: 800; font-size: .92rem; }
  .pv-strip { display: flex; height: .9rem; }
  .pv-strip i { flex: 1; }

  /* ---- fonts ---- */
  .fontgrid { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(12.5rem,1fr)); }
  .fontbtn { border: 2px solid var(--rule); border-radius: 18px; padding: .8rem .9rem; text-align: left; background: var(--paper); }
  .fontbtn[aria-pressed="true"] { border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 28%, transparent); }
  .fontbtn b { display: block; font-size: 1.3rem; line-height: 1.15; }
  .fontbtn span { font-size: .72rem; color: var(--ink-mute); }

  /* ---- values ---- */
  .value-row { border: 2px solid var(--rule); border-radius: 18px; padding: 1rem; display: grid; gap: .7rem; }
  .value-row + .value-row { margin-top: .7rem; }
  .rowhead { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }

  /* ---- persona ---- */
  .persona { border: 1px solid var(--rule); border-radius: 22px; overflow: hidden; background: var(--paper); box-shadow: var(--shadow); }
  .persona .head { display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.4rem; background: var(--sunk); border-bottom: 1px solid var(--rule); }
  .persona .av { width: 3.6rem; height: 3.6rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 1.5rem; background: var(--sky); color: #fff; }
  .persona .body { padding: 1.1rem 1.4rem; display: grid; gap: .6rem; }
  .prow { display: grid; grid-template-columns: 9.5rem minmax(0,1fr); gap: .8rem; font-size: .9rem; align-items: baseline; }
  .prow b { font-size: .64rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute); }
  .prow span { color: var(--ink-soft); }
  @media (max-width: 34rem) { .prow { grid-template-columns: minmax(0,1fr); gap: .1rem; } }

  /* ---- journey ladder ---- */
  .ladder { display: grid; gap: .5rem; }
  .rung { display: grid; grid-template-columns: 2.4rem minmax(0,1fr); gap: .9rem; align-items: center; }
  .rung .dot { width: 2.4rem; height: 2.4rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: .82rem; font-weight: 800; color: #fff; }
  .rung .say { font-family: var(--display); font-weight: 800; font-size: 1rem; }
  .rung input { margin-top: .25rem; }

  /* ---- money ---- */
  .costrow { display: grid; grid-template-columns: minmax(0,1fr) 8rem 2.2rem; gap: .5rem; align-items: center; }
  .costrow + .costrow { margin-top: .4rem; }
  .icon-btn { width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--rule); color: var(--ink-mute); }
  .icon-btn:hover { color: var(--rose); border-color: var(--rose); }

  .metrics { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(9.5rem,1fr)); }
  .metric { border: 2px solid var(--rule); border-radius: 18px; padding: .9rem 1rem; background: var(--soft); }
  .metric b { display: block; font-family: var(--display); font-size: 1.65rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .metric span { font-size: .64rem; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-mute); }
  .metric.good b { color: var(--ok); }
  .metric.bad b { color: var(--bad); }

  .verdict { border-radius: 18px; padding: 1rem 1.15rem; font-weight: 500; display: flex; gap: .7rem; align-items: flex-start; line-height: 1.55; }
  .verdict.good { background: color-mix(in srgb, var(--teal) 12%, var(--paper)); border: 2px solid color-mix(in srgb, var(--teal) 40%, var(--rule)); }
  .verdict.bad { background: color-mix(in srgb, var(--energy) 12%, var(--paper)); border: 2px solid color-mix(in srgb, var(--energy) 45%, var(--rule)); }
  .verdict.idle { background: var(--soft); border: 2px solid var(--rule); color: var(--ink-mute); }

  /* ---- pill pickers ---- */
  .pills { display: flex; flex-wrap: wrap; gap: .45rem; }
  .pill {
    padding: .45rem .95rem; border-radius: 99px; border: 2px solid var(--rule);
    background: var(--paper); font-size: .88rem; font-weight: 700; font-family: var(--display);
    transition: transform .12s ease;
  }
  .pill:hover { transform: translateY(-1px); }
  .pill[aria-pressed="true"] { background: var(--navy); color: var(--ground); border-color: var(--navy); }

  /* ---- funnel ---- */
  .funnel { display: grid; gap: .45rem; }
  .fstage { color: #fff; border-radius: 18px; padding: .95rem 1.15rem; display: grid; gap: .4rem; margin: 0 auto; width: 100%; }
  .fstage .ftop { display: flex; align-items: baseline; justify-content: space-between; gap: .7rem; flex-wrap: wrap; }
  .fstage b { font-family: var(--display); font-weight: 800; font-size: 1.05rem; letter-spacing: .02em; }
  .fstage .fnum { font-size: .85rem; opacity: .92; }
  .fstage input { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.35); color: #fff; }
  .fstage input::placeholder { color: rgba(255,255,255,.7); }
  .fstage input:focus { border-color: #fff; }

  /* ---- CRM ---- */
  .crm { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .crm th { text-align: left; font-size: .62rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute); padding: .45rem .35rem; }
  .crm td { padding: .32rem .35rem; border-top: 1px solid var(--rule); }
  .crm input, .crm select { padding: .45rem .55rem; }
  .scroll { overflow-x: auto; }
  .pipe { display: flex; gap: .45rem; flex-wrap: wrap; margin-top: 1rem; }
  .pipe div { flex: 1; min-width: 6.5rem; border-radius: 18px; padding: .7rem .6rem; text-align: center; background: var(--soft); border: 2px solid var(--rule); }
  .pipe b { display: block; font-family: var(--display); font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pipe span { font-size: .62rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-mute); }

  /* ---- automation ---- */
  .flow { display: grid; gap: .3rem; justify-items: stretch; }
  .fnode {
    border: 2px solid var(--rule); border-radius: 18px; padding: .7rem .9rem;
    background: var(--paper); display: grid; grid-template-columns: 2.1rem minmax(0,1fr) auto auto; gap: .6rem; align-items: center;
  }
  .fnode .n { width: 2.1rem; height: 2.1rem; border-radius: 50%; display: grid; place-items: center; background: var(--purple); color: #fff; font-family: var(--display); font-size: .8rem; font-weight: 800; }
  .fdown { justify-self: center; color: var(--teal); font-size: 1.2rem; line-height: 1; }

  /* ---- checklist ---- */
  .checks { display: grid; gap: .45rem; }
  .chk { display: grid; grid-template-columns: 1.6rem minmax(0,1fr); gap: .7rem; align-items: start; padding: .65rem .8rem; border-radius: 16px; border: 2px solid var(--rule); text-align: left; width: 100%; }
  .chk .box { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid var(--rule-hard); display: grid; place-items: center; color: transparent; }
  .chk[aria-pressed="true"] { background: color-mix(in srgb, var(--teal) 10%, var(--paper)); border-color: color-mix(in srgb, var(--teal) 45%, var(--rule)); }
  .chk[aria-pressed="true"] .box { background: var(--teal); border-color: var(--teal); color: #fff; }
  .chk b { font-family: var(--display); font-weight: 800; display: block; }
  .chk span { font-size: .85rem; color: var(--ink-mute); }

  /* ---- blueprint ---- */
  .bp { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fill, minmax(15rem,1fr)); }
  .bpc { border: 2px solid var(--rule); border-radius: 18px; padding: .9rem 1rem; background: var(--paper); }
  .bpc h4 { font-family: var(--body); font-size: .62rem; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-mute); font-weight: 800; margin-bottom: .35rem; }
  .bpc p { font-size: .92rem; }
  .bpc.empty { background: var(--soft); border-style: dashed; }
  .bpc.empty p { color: var(--ink-mute); font-style: italic; }

  /* ---- passport ---- */
  .passport {
    background: var(--navy); color: var(--ground);
    border-radius: 26px; padding: clamp(1.4rem, 4vw, 2.4rem);
    box-shadow: var(--shadow-lg);
  }
  .passport .pp-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
  .passport .pp-title { font-family: var(--display); font-weight: 900; font-size: clamp(1.5rem, 4vw, 2.1rem); letter-spacing: .01em; }
  .passport .pp-sub { font-size: .66rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--sun); }
  .stamps { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.2rem,1fr)); gap: .8rem; }
  .stamp {
    border-radius: 20px; padding: 1rem .6rem; text-align: center; display: grid; gap: .4rem; justify-items: center;
    border: 2px dashed rgba(247,244,236,.3); opacity: .45;
    transition: opacity .4s ease, transform .5s cubic-bezier(.3,1.5,.5,1), border-color .3s ease;
  }
  .stamp .em { font-size: 1.7rem; line-height: 1; }

<script>
(() => {
  "use strict";

  /* ===================== reference data ===================== */

  const HUES = [
    ["Trust Blue", "#2C6FD1", "trust · calm · reliable"],
    ["Growth Green", "#3E9B53", "growth · nature · health"],
    ["Optimism Yellow", "#FFC83D", "optimism · energy · youth"],
    ["Premium Black", "#15171C", "premium · confidence · focus"],

    ["Creative Purple", "#7B5EA6", "creative · imaginative · premium"],
    ["Friendly Orange", "#FF7A1A", "friendly · energetic · playful"],
    ["Fresh Teal", "#00B9A7", "fresh · balanced · modern"],

    ["Steady Navy", "#131F3A", "professional · stable · serious"],
    ["Clean White", "#FFFFFF", "simple · open · honest"],
    ["Earth Brown", "#7A5A3C", "natural · crafted · warm"]
  ];

  const FONTS = [
    { id:"sans", name:"Modern Sans", stack:'system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif', note:"clean · neutral · tech" },
    { id:"rounded", name:"Friendly Rounded", stack:'ui-rounded, "SF Pro Rounded", "Segoe UI Variable", system-ui, sans-serif', note:"warm · approachable" },

    { id:"editorial", name:"Editorial Serif", stack:'"Iowan Old Style", Palatino, "Book Antiqua", Georgia, serif', note:"premium · considered" },
    { id:"mono", name:"Tech Mono", stack:'ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace', note:"technical · precise" },
    { id:"condensed", name:"Condensed Bold", stack:'"Arial Narrow", "Helvetica Neue Condensed", "Segoe UI", sans-serif', note:"loud · sporty · urban" }
  ];

  const NAME_CRITERIA = ["Simple", "Memorable", "Easy to say", "Easy to spell", "Relevant", "Room to grow"];

  const JOURNEY = [
    ["I don't know you", "#78859F"],
    ["I notice you", "#3EA9EC"],
    ["I become interested", "#00B9A7"],
    ["I compare you", "#7B5EA6"],
    ["I trust you", "#FFC83D"],
    ["I buy", "#FF7A1A"],
    ["I come back", "#3E9B53"],
    ["I recommend you", "#E0526E"]
  ];

  const FUNNEL = [
    ["👀", "AWARENESS", "They see us", "#3EA9EC"],
    ["💭", "CONSIDERATION", "They think about us", "#00B9A7"],
    ["❤️", "TRUST", "They believe we can help", "#7B5EA6"],
    ["🛒", "CONVERSION", "They take action", "#FF7A1A"],
    ["🔁", "RETENTION", "They come back", "#3E9B53"],
    ["📣", "ADVOCACY", "They tell someone else", "#E0526E"]
  ];

  const AWARENESS = ["Social media", "Search", "Events", "Partnerships", "Referrals", "Content", "Advertising", "Community", "Press", "Word of mouth"];
  const CONSIDERATION = ["Reviews", "Proof", "Benefits", "Comparisons", "Examples", "FAQs", "Testimonials", "Guarantee", "Case study", "Free sample"];
  const CONVERSIONS = ["Buy", "Book", "Register", "Call", "Request a quote", "Download", "Subscribe", "Visit us"];

  const CRM_STATUS = [
    ["Lead", "#78859F"], ["Prospect", "#3EA9EC"], ["Customer", "#00B9A7"],
    ["Returning", "#3E9B53"], ["Advocate", "#E0526E"]
  ];

  const POLICY_LIST = [
    ["returns", "Return Policy", "Can someone send it back? By when? Who pays postage?"],
    ["cancel", "Cancellation Policy", "Can a booking be cancelled? How much notice?"],
    ["shipping", "Shipping Policy", "How is it delivered, how fast, and what does it cost?"],
    ["payment", "Payment Policy", "What payment methods, when is payment due, deposits?"],
    ["guidelines", "Community Guidelines", "How do people behave in your space? What is not allowed?"]
  ];

  const TERMS_LIST = [
    ["payments", "Payments", "When money is due and what happens if it is not paid"],
    ["responsibilities", "Responsibilities", "What you promise to do, and what the customer must do"],
    ["use", "Acceptable use", "What people may and may not do with your product or space"],
    ["refunds", "Refunds & cancellations", "Points back at your policy so the two agree"],
    ["limits", "Limitations", "What you are not responsible for — honestly stated"],
    ["ownership", "Ownership", "Who owns the designs, photos, and content"],
    ["accounts", "Account rules", "If people sign up: age, one account each, closing an account"]
  ];

  const STAMPS = [
    ["idea", "💡", "IDEA", "One-sentence business"],
    ["brand", "🎨", "BRAND", "Name, colours, fonts"],
    ["purpose", "❤️", "PURPOSE", "Mission, vision, values"],
    ["customer", "👥", "CUSTOMER", "Persona and journey"],
    ["money", "💰", "MONEY", "Costs, price, margin"],
    ["marketing", "📣", "MARKETING", "Funnel and CTA"],
    ["crm", "🔄", "CRM", "Real customer list"],
    ["automation", "⚡", "AUTOMATION", "A working system"],
    ["community", "🌎", "COMMUNITY", "A promise to members"],
    ["launch", "🚀", "LAUNCH", "Blueprint complete"]
  ];

  const PARTS = [
    { id:"start", tag:"Start", title:"GO OVERSEAS!" },
    { id:"idea", tag:"Part 1", title:"Start with the idea" },
    { id:"identity", tag:"Part 2", title:"Give it an identity" },
    { id:"beliefs", tag:"Part 3", title:"What does my brand believe?" },
    { id:"audience", tag:"Part 4", title:"Know who you're building for" },
    { id:"price", tag:"Part 5", title:"Price it" },
    { id:"notice", tag:"Part 6", title:"Get people to notice you" },
    { id:"funnel", tag:"Part 7", title:"The marketing funnel" },
    { id:"numbers", tag:"Part 8", title:"Understand the numbers" },
    { id:"crm", tag:"Part 9", title:"Build relationships" },
    { id:"automation", tag:"Part 10", title:"Automation" },
    { id:"community", tag:"Part 11", title:"Build the community" },
    { id:"protect", tag:"Part 12", title:"Protect the business" },
    { id:"blueprint", tag:"Part 13", title:"My Brand Blueprint" },
    { id:"passport", tag:"Part 14", title:"GO OVERSEAS!" }
  ];

  /* ===================== state ===================== */

  const KEY = "lf-go-overseas-v1";
  const fresh = () => ({
    founder: "",
    idea: { problem:"", offer:"", type:"", why:"", different:"", sentence:"" },
    names: [], chosenName: "",
    feelings: [],
    colours: { primary:"#FF7A1A", secondary:"#131F3A", accent:"#FFC83D", background:"#F6F3EA" },
    fonts: { headline:"rounded", body:"sans", accent:"mono" },
    tagline: "",
    mission: { who:"", what:"", how:"" },
    vision: "",
    values: [],
    persona: { name:"", age:"", place:"", needs:"", frustrates:"", buys:"", time:"", trust:"" },
    journey: ["","","","","","","",""],
    costs: [], price: { method:"", amount:"" },
    awareness: [], consideration: [], cta: { action:"", text:"" },
    funnelNotes: ["","","","","",""],
    ads: { spend:"", leads:"", customers:"", order:"" },
    crm: [], automation: [],
    community: { why:"", common:"", included:"", helping:"", promise:"" },
    privacy: [], policies: {}, terms: {},
    launch: "",
    stamps: {}
  });
  let B = fresh();

  function save() { try { localStorage.setItem(KEY, JSON.stringify(B)); } catch (e) {} }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) B = Object.assign(fresh(), JSON.parse(raw));
    } catch (e) {}
  }

  /* ===================== helpers ===================== */

  const $ = id => document.getElementById(id);
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const ic = id => '<svg class="ic" aria-hidden="true"><use href="#' + id + '"/></svg>';
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
  const money = n => "$" + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const filled = s => String(s || "").trim().length > 1;
  const fontStack = id => (FONTS.find(f => f.id === id) || FONTS[0]).stack;

  function toast(title, body) {
    const t = el("div", "toast", "<b>" + esc(title) + "</b><span>" + esc(body) + "</span>");
    $("toasts").appendChild(t);
    setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = "0"; setTimeout(() => t.remove(), 320); }, 3800);
  }
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const box = el("div", "confetti");
    const cols = ["#FFC83D", "#FF7A1A", "#3EA9EC", "#00B9A7", "#E0526E", "#7B5EA6"];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement("i");
      p.style.left = (Math.random() * 100) + "vw";
      p.style.background = cols[i % cols.length];
      p.style.animationDelay = (Math.random() * .6) + "s";
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 3400);
  }

  /* bound inputs */
  function bind(node, get, set) {
    node.value = get() || "";
    node.addEventListener("input", () => { set(node.value); save(); refreshStamps(); });
    return node;
  }
  function field(label, hint, get, set, opts) {
    opts = opts || {};
    const f = el("div", "fld");
    const id = "f" + Math.random().toString(36).slice(2, 8);
    f.innerHTML = '<label class="lbl" for="' + id + '">' + esc(label) + '</label>' +
      (hint ? '<span class="hint">' + esc(hint) + '</span>' : "");
    const input = document.createElement(opts.area ? "textarea" : "input");
    input.id = id;
    if (opts.area) input.rows = opts.rows || 2;
    else input.type = opts.type || "text";
    if (opts.placeholder) input.placeholder = opts.placeholder;
    bind(input, get, set);
    if (opts.onInput) input.addEventListener("input", opts.onInput);
    f.appendChild(input);
    return f;
  }

  /* ===================== stamps ===================== */

  function stampChecks() {
    const c = B.colours, p = B.persona;
    return {
      idea: filled(B.idea.sentence) && filled(B.idea.problem),
      brand: filled(B.chosenName) && !!c.primary && !!c.secondary && !!c.accent && !!B.fonts.headline,
      purpose: filled(B.mission.who) && filled(B.mission.what) && filled(B.mission.how) && filled(B.vision) && B.values.filter(v => filled(v.name) && filled(v.looks)).length >= 2,
      customer: [p.name, p.age, p.needs, p.frustrates, p.time].filter(filled).length >= 4 && B.journey.filter(filled).length >= 4,
      money: B.costs.filter(x => num(x.amount) > 0).length >= 3 && num(B.price.amount) > 0,
      marketing: B.awareness.length >= 2 && B.consideration.length >= 2 && filled(B.cta.text),
      crm: B.crm.filter(r => filled(r.name)).length >= 3,
      automation: B.automation.filter(filled).length >= 4,
      community: filled(B.community.promise) && filled(B.community.why),
      launch: false
    };
  }

  function refreshStamps(silent) {
    const c = stampChecks();
    c.launch = STAMPS.slice(0, 9).every(([k]) => c[k]) && filled(B.launch);
    let gained = null;
    STAMPS.forEach(([k, em, label]) => {
      if (c[k] && !B.stamps[k]) { B.stamps[k] = 1; gained = label; }
      if (!c[k] && B.stamps[k]) delete B.stamps[k];
    });
    save();
    paintProgress();
    if (gained && !silent) {
      toast(gained + " stamped!", "Founder Passport updated.");
      confetti();
    }
    return c;
  }

  const stampCount = () => STAMPS.filter(([k]) => B.stamps[k]).length;

  function paintProgress() {
    const n = stampCount();
    $("progBar").style.width = (n * 10) + "%";
    $("progLabel").textContent = n + " / 10 stamps";
    const mini = $("pmini");
    mini.innerHTML = "";
    STAMPS.forEach(([k, em, label]) => {
      const d = el("div", "pmini" + (B.stamps[k] ? " got" : ""), em);
      d.title = label;
      mini.appendChild(d);
    });
    renderNav();
  }

  /* ===================== nav ===================== */

  let cur = "start";

  function renderNav() {
    const nav = $("stepsNav");
    nav.innerHTML = "";
    const c = stampChecks();
    const doneMap = {
      idea:"idea", identity:"brand", beliefs:"purpose", audience:"customer", price:"money",
      notice:"marketing", funnel:"marketing", numbers:"money", crm:"crm", automation:"automation",
      community:"community", blueprint:"launch"
    };
    PARTS.forEach(p => {
      const b = el("button", "snav" + (doneMap[p.id] && B.stamps[doneMap[p.id]] ? " done" : ""),
        '<i>' + esc(p.tag) + '</i><span>' + esc(p.title) + '</span>');
      if (p.id === cur) b.setAttribute("aria-current", "step");
      b.addEventListener("click", () => go(p.id));
      nav.appendChild(b);
    });
  }

  function go(id) {
    cur = id;
    const p = PARTS.find(x => x.id === id) || PARTS[0];
    $("where").textContent = p.tag + " · " + p.title;
    $("rail").classList.remove("open");
    const s = document.querySelector(".scrim"); if (s) s.remove();
    render();
    window.scrollTo({ top: 0 });
  }

  function pagenav(host) {
    const i = PARTS.findIndex(p => p.id === cur);
    const nav = el("div", "pagenav");
    if (i > 0) {
      const b = el("button", "btn ghost", ic("i-prev") + PARTS[i - 1].title);
      b.addEventListener("click", () => go(PARTS[i - 1].id));
      nav.appendChild(b);
    } else nav.appendChild(el("span"));
    if (i < PARTS.length - 1) {
      const b = el("button", "btn", PARTS[i + 1].title + ic("i-next"));
      b.addEventListener("click", () => go(PARTS[i + 1].id));
      nav.appendChild(b);
    }
    host.appendChild(nav);

    const band = el("div", "bandfoot");
    band.innerHTML = [["Build it.", "sun"], ["Brand it.", "energy"], ["Launch it.", "sky"]]
      .map(([w, c]) => '<i style="color:var(--' + c + ')">' + w + '</i>').join(" ");
    host.appendChild(band);
  }

  function header(host, tag, title, lede) {
    host.appendChild(el("p", "part-tag", esc(tag)));
    host.appendChild(el("h1", null, esc(title)));
    if (lede) host.appendChild(el("p", "lede", esc(lede)));
    const d = document.createElement("div");
    d.className = "lf-div";
    d.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#lf-star4"/></svg>';
    host.appendChild(d);
  }
  function chapter(host, num, title, sub) {
    const c = el("section", "ch");
    c.innerHTML = '<div class="ch-head"><span class="ch-num">' + esc(num) + '</span><h2>' + esc(title) + '</h2></div>' +
      (sub ? '<p class="sub">' + esc(sub) + '</p>' : "");

  }

  /* ===================== brand preview ===================== */

  function brandPreview() {

      '<div class="pv-top" style="background:' + esc(c.background) + ';color:' + esc(c.secondary) + ';font-family:' + fontStack(B.fonts.body) + '">' +

          '<span class="pv-mark" style="background:' + esc(c.primary) + ';color:' + esc(c.background) + ';font-family:' + fontStack(B.fonts.headline) + '">' + esc(initial) + '</span>' +
          '<span class="pv-name" style="font-family:' + fontStack(B.fonts.headline) + '">' + esc(name) + '</span>' +
        '</div>' +
        '<p class="pv-tag">' + esc(B.tagline || B.idea.sentence || "Your one-sentence promise goes here.") + '</p>' +
        '<span class="pv-cta" style="background:' + esc(c.accent) + ';color:' + esc(c.secondary) + ';font-family:' + fontStack(B.fonts.accent) + '">' +

  /* ===================== views ===================== */

  function render() {
    const v = $("view");
    v.innerHTML = "";
    ({ start:vStart, idea:vIdea, identity:vIdentity, beliefs:vBeliefs, audience:vAudience, price:vPrice,
       notice:vNotice, funnel:vFunnel, numbers:vNumbers, crm:vCRM, automation:vAuto, community:vCommunity,
       protect:vProtect, blueprint:vBlueprint, passport:vPassport }[cur] || vStart)(v);
    pagenav(v);
    renderNav();
  }

  /* -------- start -------- */
  function vStart(v) {
    header(v, "Founder CEO · Ages 14–17 · Book 4", "GO OVERSEAS!",
      "Build your first real brand from zero. From an idea in your head to a brand people can recognise, trust and buy from.");

    const flow = el("div", "card");
    flow.style.marginTop = "1.4rem";
    flow.innerHTML = '<span class="lbl">The mindset</span>';
    const pills = el("div", "pills");
    ["Think","Define","Brand","Price","Market","Connect","Automate","Launch","Grow"].forEach((w, i) => {
      const s = el("span", "pill");
      s.textContent = w;
      s.setAttribute("aria-pressed", "false");
      s.style.borderColor = ["#3EA9EC","#00B9A7","#7B5EA6","#FF7A1A","#E0526E","#3E9B53","#FFC83D","#131F3A","#2C6FD1"][i];
      pills.appendChild(s);
    });
    flow.appendChild(pills);
    v.appendChild(flow);

    const c = el("div", "card");
    c.appendChild(field("Founder name", "Goes on your certificate at the end.",
      () => B.founder, x => B.founder = x.slice(0, 60), { placeholder: "Your name" }));
    v.appendChild(c);

    const map = el("div", "card");
    map.innerHTML = '<span class="lbl">What you will build</span><p class="hint" style="margin-bottom:.8rem">Fourteen parts. Ten passport stamps. One complete brand.</p>';
    const bp = el("div", "bp");
    [["💡 Idea","One sentence that explains your business"],
     ["🎨 Brand","Name, colours, fonts, live brand card"],
     ["❤️ Purpose","Mission, vision, values defined as behaviours"],
     ["👥 Customer","A persona and an eight-step journey"],
     ["💰 Money","Real costs, a price, and a gross margin"],
     ["📣 Marketing","Awareness, consideration, conversion, funnel"],
     ["📊 Numbers","Cost per lead, cost per conversion, verdict"],
     ["🔄 CRM","A working customer list with a pipeline"],
     ["⚡ Automation","A step-by-step system map"],
     ["🌎 Community","A promise members can hold you to"],
     ["🛡 Protection","Privacy map, policies, business rules"],
     ["🚀 Launch","The Brand Blueprint and Founder Passport"]].forEach(([t, d]) => {
      bp.appendChild(el("div", "bpc", "<h4>" + esc(t) + "</h4><p>" + esc(d) + "</p>"));
    });
    map.appendChild(bp);
    v.appendChild(map);
  }

  /* -------- part 1: idea -------- */
  function vIdea(v) {
    header(v, "Part 1", "Start with the idea", "What am I building?");
    const ch = chapter(v, "Chapter 1", "My Business Idea", "Answer these first. The one-sentence version comes last, and it gets easier once the five answers exist.");
    const c = el("div", "card");
    c.appendChild(field("What problem am I solving?", "Whose problem is it, and when does it hurt?",
      () => B.idea.problem, x => B.idea.problem = x, { area:true, placeholder:"People who… struggle to… because…" }));
    c.appendChild(field("What am I offering?", "", () => B.idea.offer, x => B.idea.offer = x, { area:true }));
    const typeF = el("div", "fld");
    typeF.innerHTML = '<span class="lbl">Product, service, or both?</span>';
    const tp = el("div", "pills");
    ["Product","Service","Both"].forEach(t => {
      const b = el("button", "pill");
      b.textContent = t;
      b.setAttribute("aria-pressed", String(B.idea.type === t));
      b.addEventListener("click", () => { B.idea.type = t; save(); render(); });
      tp.appendChild(b);
    });
    typeF.appendChild(tp);
    c.appendChild(typeF);
    c.appendChild(field("Why would someone care?", "", () => B.idea.why, x => B.idea.why = x, { area:true }));
    c.appendChild(field("What makes my idea different?", "If a competitor could say the same sentence, it is not a difference.",
      () => B.idea.different, x => B.idea.different = x, { area:true }));
    ch.appendChild(c);

    const out = el("div", "card");
    out.style.borderColor = "var(--energy)";
    out.innerHTML = '<span class="lbl">Workbook output — My Business in One Sentence</span>' +
      '<p class="hint" style="margin-bottom:.6rem">Template: <b>We help [who] to [do what] by [how].</b> Under 25 words.</p>';
    const ta = document.createElement("textarea");
    ta.rows = 2;
    ta.placeholder = "We help…";
    bind(ta, () => B.idea.sentence, x => { B.idea.sentence = x.slice(0, 220); });
    const count = el("p", "hint");
    const upd = () => {
      const w = (B.idea.sentence || "").trim().split(/\s+/).filter(Boolean).length;
      count.textContent = w + " words" + (w > 25 ? " — try to cut it down" : w >= 6 ? " — good length" : "");
      count.style.color = w > 25 ? "var(--warn)" : "";
    };
    ta.addEventListener("input", upd);
    out.appendChild(ta);
    out.appendChild(count);
    upd();
    ch.appendChild(out);
  }

  /* -------- part 2: identity -------- */
  function vIdentity(v) {
    header(v, "Part 2", "Give it an identity", "Turn the idea into a brand.");

    /* ch 2 — name */
    const ch2 = chapter(v, "Chapter 2", "Name My Business", "Name Storm → Shortlist → Test → Choose. Score each name 0–2 on the six tests, then pick the winner — or a lower scorer, if you can say why.");
    const nc = el("div", "card");
    const tblWrap = el("div", "scroll");
    const tbl = el("table", "nametable");
    const best = B.names.length ? Math.max.apply(null, B.names.map(n => (n.scores || []).reduce((a, b) => a + b, 0))) : -1;
    tbl.innerHTML = "<thead><tr><th>Name idea</th>" +
      NAME_CRITERIA.map(c => "<th>" + esc(c) + "</th>").join("") + "<th>Total</th><th></th></tr></thead>";
    const tb = el("tbody");
    B.names.forEach((row, i) => {
      row.scores = row.scores || [0,0,0,0,0,0];
      const total = row.scores.reduce((a, b) => a + b, 0);
      const tr = el("tr", total === best && total > 0 ? "winner" : "");
      const td0 = el("td");
      const inp = document.createElement("input");
      inp.type = "text"; inp.placeholder = "Name " + (i + 1);
      bind(inp, () => row.name, x => row.name = x.slice(0, 40));
      inp.addEventListener("input", () => { if (B.chosenName && !B.names.some(n => n.name === B.chosenName)) {} });
      td0.appendChild(inp);
      tr.appendChild(td0);
      NAME_CRITERIA.forEach((_, ci) => {
        const td = el("td");
        const sc = el("div", "score");
        [0,1,2].forEach(val => {
          const b = el("button", null, String(val));
          b.setAttribute("aria-pressed", String(row.scores[ci] === val));
          b.setAttribute("aria-label", NAME_CRITERIA[ci] + " score " + val);
          b.addEventListener("click", () => { row.scores[ci] = val; save(); render(); });
          sc.appendChild(b);
        });
        td.appendChild(sc);
        tr.appendChild(td);
      });
      tr.appendChild(el("td", "total", String(total)));
      const tdx = el("td");
      const x = el("button", "icon-btn", ic("i-x"));
      x.setAttribute("aria-label", "Remove name");
      x.addEventListener("click", () => { B.names.splice(i, 1); save(); render(); });
      tdx.appendChild(x);
      tr.appendChild(tdx);
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    tblWrap.appendChild(tbl);
    nc.appendChild(tblWrap);

    const addRow = el("div");
    addRow.style.marginTop = ".8rem";
    const add = el("button", "btn ghost sm", ic("i-plus") + "Add a name idea");
    add.addEventListener("click", () => { B.names.push({ name:"", scores:[0,0,0,0,0,0] }); save(); render(); });
    addRow.appendChild(add);
    if (B.names.length < 10) {
      const hint = el("span", "hint");
      hint.style.marginLeft = ".6rem";
      hint.textContent = "Aim for 10 before you shortlist. Bad ideas make the good ones visible.";
      addRow.appendChild(hint);
    }
    nc.appendChild(addRow);
    ch2.appendChild(nc);

    const pick = el("div", "card");
    pick.innerHTML = '<span class="lbl">My chosen name</span>';
    const ps = el("div", "pills");
    B.names.filter(n => filled(n.name)).forEach(n => {
      const b = el("button", "pill");
      b.textContent = n.name;
      b.setAttribute("aria-pressed", String(B.chosenName === n.name));
      b.addEventListener("click", () => { B.chosenName = n.name; save(); refreshStamps(); render(); });
      ps.appendChild(b);
    });
    if (!B.names.filter(n => filled(n.name)).length) ps.appendChild(el("span", "hint", "Add some name ideas above first."));
    pick.appendChild(ps);
    pick.appendChild(field("Tagline (optional)", "Five to eight words that say what you do.",
      () => B.tagline, x => B.tagline = x.slice(0, 80), { placeholder:"e.g. Build your first brand." }));
    ch2.appendChild(pick);

    /* ch 3 — colours */
    const ch3 = chapter(v, "Chapter 3", "My Brand Colours", "Not “choose your favourite colours.” Ask: what should people feel when they see my brand?");
    const feel = el("div", "card");
    feel.innerHTML = '<span class="lbl">Pick the feelings you want — then choose colours that carry them</span>';
    const hues = el("div", "hues");
    hues.style.marginTop = ".7rem";
    HUES.forEach(([nm, hex, meaning]) => {
      const b = el("button", "hue");
      b.setAttribute("aria-pressed", String(B.feelings.includes(nm)));
      b.innerHTML = '<span class="chip" style="background:' + hex + '"></span>' +
        '<span class="meta"><b>' + esc(nm) + '</b><span>' + esc(meaning) + '</span></span>';
      b.addEventListener("click", () => {
        const i = B.feelings.indexOf(nm);
        if (i >= 0) B.feelings.splice(i, 1); else B.feelings.push(nm);
        if (i < 0) {
          if (!B._touched) { B.colours.primary = hex; B._touched = 1; }
        }
        save(); render();
      });
      hues.appendChild(b);
    });
    feel.appendChild(hues);
    ch3.appendChild(feel);

    const slotsCard = el("div", "card");
    slotsCard.innerHTML = '<span class="lbl">My four brand colours</span><p class="hint">Primary carries the brand. Secondary is your text. Accent is for buttons only — the thing you want clicked. Background is the calm one.</p>';
    const slots = el("div", "slots");
    slots.style.marginTop = ".8rem";
    [["primary","Primary"],["secondary","Secondary"],["accent","Accent"],["background","Background"]].forEach(([k, label]) => {
      const s = el("div", "slot");
      s.innerHTML = '<label>' + label + '</label><div class="sw" style="background:' + esc(B.colours[k]) + '"></div>';
      const inp = document.createElement("input");
      inp.type = "color";
      inp.value = B.colours[k];
      inp.setAttribute("aria-label", label + " colour");
      inp.addEventListener("input", e => {
        B.colours[k] = e.target.value;
        s.querySelector(".sw").style.background = e.target.value;
        save(); updatePreview();
      });
      s.appendChild(inp);
      slots.appendChild(s);
    });
    slotsCard.appendChild(slots);
    ch3.appendChild(slotsCard);

    /* ch 4 — fonts */
    const ch4 = chapter(v, "Chapter 4", "My Brand Fonts", "Three roles: headline, body, accent. Consistency is the whole point — one set of fonts, used the same way every time, is what makes a brand look like a brand.");
    [["headline","Headline font","Titles and your logo wordmark"],
     ["body","Body font","Paragraphs and long text — readability wins here"],
     ["accent","Accent font","Buttons, labels, numbers, small caps"]].forEach(([slot, label, note]) => {
      const c = el("div", "card");
      c.innerHTML = '<span class="lbl">' + label + '</span><p class="hint">' + note + '</p>';
      const g = el("div", "fontgrid");
      g.style.marginTop = ".7rem";
      FONTS.forEach(f => {
        const b = el("button", "fontbtn");
        b.setAttribute("aria-pressed", String(B.fonts[slot] === f.id));
        b.innerHTML = '<b style="font-family:' + f.stack + '">' + esc(B.chosenName || "Brand Name") + '</b>' +
          '<span>' + esc(f.name) + ' · ' + esc(f.note) + '</span>';
        b.addEventListener("click", () => { B.fonts[slot] = f.id; save(); refreshStamps(); render(); });
        g.appendChild(b);
      });
      c.appendChild(g);
      ch4.appendChild(c);
    });
    const note = el("p", "hint");
    note.style.marginTop = ".6rem";
    note.textContent = "These families are on almost every device, so your brand looks the same for everyone without loading anything.";
    ch4.appendChild(note);

    /* style card */
    const sc = chapter(v, "Output", "My Brand Style Card", "This updates live as you change anything above.");
    const pv = el("div");
    pv.id = "pvHost";
    pv.appendChild(brandPreview());
    sc.appendChild(pv);
    const meta = el("div", "card");
    meta.style.marginTop = ".9rem";
    meta.innerHTML =
      '<div class="bp">' +
        '<div class="bpc"><h4>Name</h4><p>' + esc(B.chosenName || "—") + '</p></div>' +
        '<div class="bpc"><h4>Feelings</h4><p>' + esc(B.feelings.join(", ") || "—") + '</p></div>' +
        '<div class="bpc"><h4>Colours</h4><p style="font-family:var(--mono);font-size:.82rem">' +
          Object.values(B.colours).map(esc).join(" · ") + '</p></div>' +
        '<div class="bpc"><h4>Fonts</h4><p>' +
          esc((FONTS.find(f => f.id === B.fonts.headline) || {}).name) + " / " +
          esc((FONTS.find(f => f.id === B.fonts.body) || {}).name) + " / " +
          esc((FONTS.find(f => f.id === B.fonts.accent) || {}).name) + '</p></div>' +
      '</div>';
    sc.appendChild(meta);
  }

  function updatePreview() {
    const host = $("pvHost");
    if (!host) return;
    host.innerHTML = "";
    host.appendChild(brandPreview());
  }

  /* -------- part 3: beliefs -------- */
  function vBeliefs(v) {
    header(v, "Part 3", "What does my brand believe?", "This is where Founder CEO gets more serious than the younger books. A mission is not a slogan and a value is not a word — it is a behaviour someone could catch you breaking.");

    const ch5 = chapter(v, "Chapter 5", "Mission", "What do we do today, for whom, and why?");
    const m = el("div", "card");
    const mrow = el("div", "grid2");
    mrow.appendChild(field("We help…", "Who exactly?", () => B.mission.who, x => B.mission.who = x, { placeholder:"students who…" }));
    mrow.appendChild(field("to…", "Do what?", () => B.mission.what, x => B.mission.what = x, { placeholder:"find part-time work" }));
    m.appendChild(mrow);
    m.appendChild(field("by…", "How do you do it — the method, not the ambition.", () => B.mission.how, x => B.mission.how = x, { placeholder:"matching them to local shifts in under 24 hours" }));
    const preview = el("div", "verdict idle");
    preview.style.marginTop = ".9rem";
    const paintM = () => {
      const done = filled(B.mission.who) && filled(B.mission.what) && filled(B.mission.how);
      preview.className = "verdict " + (done ? "good" : "idle");
      preview.innerHTML = "<span>" + (done
        ? "<b>Mission:</b> We help " + esc(B.mission.who) + " to " + esc(B.mission.what) + " by " + esc(B.mission.how) + "."
        : "Fill the three blanks to build your mission statement.") + "</span>";
    };
    m.addEventListener("input", paintM);
    m.appendChild(preview);
    paintM();
    ch5.appendChild(m);

    const ch6 = chapter(v, "Chapter 6", "Vision", "What future are we trying to create? Ask: if our business becomes successful, what changes because we existed?");
    const vi = el("div", "card");
    vi.appendChild(field("Our vision", "Write it as a world, not as a company milestone. “Every teenager in our city can find their first job in a week” beats “be the biggest app.”",
      () => B.vision, x => B.vision = x, { area:true, rows:3 }));
    ch6.appendChild(vi);

    const ch7 = chapter(v, "Chapter 7", "Core Values", "Do not just pick Integrity / Innovation / Excellence. Define the behaviour — what it means, and what it actually looks like on a normal Tuesday.");
    const vc = el("div", "card");
    const ex = el("div", "verdict idle");
    ex.innerHTML = "<span><b>Example — Keep It Simple.</b> What it means: we make complicated things easier. What it looks like: clear pricing, clear instructions, simple communication.</span>";
    vc.appendChild(ex);
    const list = el("div");
    list.style.marginTop = ".9rem";
    B.values.forEach((val, i) => {
      const row = el("div", "value-row");
      const head = el("div", "rowhead");
      const nameIn = document.createElement("input");
      nameIn.type = "text"; nameIn.placeholder = "Value name — e.g. Keep It Simple";
      bind(nameIn, () => val.name, x => val.name = x.slice(0, 60));
      head.appendChild(nameIn);
      const del = el("button", "icon-btn", ic("i-x"));
      del.setAttribute("aria-label", "Remove value");
      del.addEventListener("click", () => { B.values.splice(i, 1); save(); render(); });
      head.appendChild(del);
      row.appendChild(head);
      row.appendChild(field("What it means", "", () => val.means, x => val.means = x, { area:true }));
      row.appendChild(field("What it looks like", "Something a customer could actually see or a teammate could be held to.", () => val.looks, x => val.looks = x, { area:true }));
      list.appendChild(row);
    });
    vc.appendChild(list);
    const addV = el("button", "btn ghost sm", ic("i-plus") + "Add a value");
    addV.style.marginTop = ".8rem";
    addV.addEventListener("click", () => { B.values.push({ name:"", means:"", looks:"" }); save(); render(); });
    vc.appendChild(addV);
    if (B.values.length > 4) vc.appendChild(el("p", "hint", "More than four values means none of them are values. Consider cutting."));
    ch7.appendChild(vc);
  }

  /* -------- part 4: audience -------- */
  function vAudience(v) {
    header(v, "Part 4", "Know who you're building for", "Your product isn't for everyone. The moment you say “everyone”, your marketing has nowhere to point.");

    const ch8 = chapter(v, "Chapter 8", "My Target Audience", "Build one specific person. Give them a name. If you cannot picture them ordering, the profile is still too vague.");
    const c = el("div", "card");
    const g = el("div", "grid2");
    g.appendChild(field("Their name", "", () => B.persona.name, x => B.persona.name = x, { placeholder:"Sam" }));
    g.appendChild(field("How old are they?", "", () => B.persona.age, x => B.persona.age = x, { placeholder:"16" }));
    c.appendChild(g);
    c.appendChild(field("Where are they?", "", () => B.persona.place, x => B.persona.place = x, { placeholder:"Grade 11, lives 20 minutes from downtown" }));
    c.appendChild(field("What do they need?", "", () => B.persona.needs, x => B.persona.needs = x, { area:true }));
    c.appendChild(field("What frustrates them?", "The specific annoyance, not a general complaint.", () => B.persona.frustrates, x => B.persona.frustrates = x, { area:true }));
    c.appendChild(field("What do they already buy?", "Your real competition is what they spend on today.", () => B.persona.buys, x => B.persona.buys = x, { area:true }));

    c.appendChild(field("What makes them trust a company?", "", () => B.persona.trust, x => B.persona.trust = x, { area:true }));
    ch8.appendChild(c);

    const card = el("div", "persona");
    card.style.marginTop = ".9rem";
    const initial = ((B.persona.name || "?").trim()[0] || "?").toUpperCase();
    const rows = [
      ["Age", B.persona.age], ["Where", B.persona.place], ["Needs", B.persona.needs],
      ["Frustrated by", B.persona.frustrates], ["Already buys", B.persona.buys],
      ["Spends time", B.persona.time], ["Trusts because", B.persona.trust]
    ];
    card.innerHTML =
      '<div class="head"><span class="av" style="background:' + esc(B.colours.primary) + '">' + esc(initial) + '</span>' +
      '<div><b style="font-family:var(--display);font-size:1.15rem">' + esc(B.persona.name || "My customer") + '</b>' +

      '<div class="body">' + rows.map(([k, val]) =>
        '<div class="prow"><b>' + esc(k) + '</b><span>' + esc(val || "—") + '</span></div>').join("") + '</div>';
    ch8.appendChild(card);

    const ch9 = chapter(v, "Chapter 9", "Customer Journey", "Before the funnel, think like the customer. Write one line for each step: what would have to happen, for this person, to move to the next rung?");
    const jc = el("div", "card");
    const lad = el("div", "ladder");

      const left = el("span", "dot", String(i + 1));

      right.innerHTML = '<div class="say">' + esc(label) + '</div>';
      const inp = document.createElement("input");
      inp.type = "text";
      inp.placeholder = "What makes this happen?";
      bind(inp, () => B.journey[i], x => B.journey[i] = x.slice(0, 160));
      right.appendChild(inp);
      r.appendChild(left); r.appendChild(right);
      lad.appendChild(r);
    });
    jc.appendChild(lad);
    ch9.appendChild(jc);
  }

  /* -------- part 5: price -------- */
  function vPrice(v) {
    header(v, "Part 5", "Price it", "Cost ≠ price. One is arithmetic, the other is a decision.");

    const ch10 = chapter(v, "Chapter 10", "What Does It Really Cost?", "Everything it takes to deliver one unit. Founders forget transaction fees, packaging, and their own labour — and then wonder where the money went.");
    const c = el("div", "card");
    const rows = el("div");
    if (!B.costs.length) {
      ["Product/service cost","Packaging","Labour","Delivery","Software","Advertising","Transaction fees"].forEach(l => B.costs.push({ label:l, amount:"" }));
      save();
    }

    function paintMargin() {
      const cost = B.costs.reduce((a, x) => a + num(x.amount), 0);

      const gm = price > 0 ? (gp / price * 100) : 0;
      marginBox.innerHTML = "";

          : gm < 20
            ? "<b>Margin is thin at " + gm.toFixed(1) + "%.</b> One refund, one mistake, or one price rise from a supplier wipes out the profit on several sales."
            : "<b>" + money(gp) + " kept per sale (" + gm.toFixed(1) + "% margin).</b> That is the money that has to cover getting the customer in the first place — check Part 8.") + "</span>";
      marginBox.appendChild(vd);

  /* -------- part 8: numbers -------- */
  function vNumbers(v) {
    header(v, "Part 8", "Understand the numbers", "This is where founders stop saying “the ad got lots of views” and start making decisions with numbers.");

    const c = el("div", "card");
    const g = el("div", "grid2");
    ["spend|Advertising spend|What you put in|500",
     "leads|Leads generated|People who showed interest|50",
     "customers|Customers who bought|People who actually paid|10",
     "order|Average order value|What one customer spends|150"].forEach(spec => {
      const [k, label, note, ph] = spec.split("|");
      const f = field(label, note, () => B.ads[k], x => B.ads[k] = x, { type:"number", placeholder: ph });
      f.querySelector("input").addEventListener("input", paint);
      g.appendChild(f);
    });
    c.appendChild(g);
    const out = el("div");
    out.style.marginTop = "1rem";
    c.appendChild(out);
    v.appendChild(c);

    function paint() {
      const spend = num(B.ads.spend), leads = num(B.ads.leads), custs = num(B.ads.customers), order = num(B.ads.order);
      const cost = B.costs.reduce((a, x) => a + num(x.amount), 0);
      const price = num(B.price.amount);
      const marginPct = price > 0 ? (price - cost) / price : 0;
      const cpl = leads > 0 ? spend / leads : 0;
      const cpc = custs > 0 ? spend / custs : 0;
      const gpPerCustomer = order > 0 ? order * marginPct : (price > 0 ? price - cost : 0);
      out.innerHTML = "";

      const m = el("div", "metrics");
      m.innerHTML =
        '<div class="metric"><b>' + (leads > 0 ? money(cpl) : "—") + '</b><span>Cost per lead</span></div>' +
        '<div class="metric"><b>' + (custs > 0 ? money(cpc) : "—") + '</b><span>Cost per conversion</span></div>' +
        '<div class="metric"><b>' + (leads > 0 && custs > 0 ? (custs / leads * 100).toFixed(1) + "%" : "—") + '</b><span>Lead → customer</span></div>' +
        '<div class="metric"><b>' + (gpPerCustomer > 0 ? money(gpPerCustomer) : "—") + '</b><span>Gross profit / customer</span></div>';
      out.appendChild(m);

      const ready = custs > 0 && gpPerCustomer > 0;
      const works = ready && gpPerCustomer > cpc;
      const vd = el("div", "verdict " + (!ready ? "idle" : works ? "good" : "bad"));
      vd.style.marginTop = ".9rem";
      vd.innerHTML = "<span>" + (!ready
        ? "Fill in spend, customers, and an order value — and set your price in Part 5 — to get a verdict."
        : works
          ? "<b>This is working.</b> Each customer costs " + money(cpc) + " to win and leaves " + money(gpPerCustomer) +
            " of gross profit. You keep " + money(gpPerCustomer - cpc) + " per customer, so spending more is a reasonable next move."
          : "<b>This is not working yet.</b> Each customer costs " + money(cpc) + " to win but only leaves " + money(gpPerCustomer) +
            " of gross profit — you lose " + money(cpc - gpPerCustomer) + " every time someone buys. Spending more advertising money makes the hole bigger. " +
            "Fix one of three things: raise the price, cut the cost, or improve the conversion rate.") + "</span>";
      out.appendChild(vd);

      if (ready) {
        const steps = el("div", "card");
        steps.style.marginTop = ".9rem";
        steps.style.boxShadow = "none";
        steps.innerHTML = '<span class="lbl">The working</span>' +
          '<p style="font-family:var(--mono);font-size:.84rem;line-height:1.9">' +
          "CPL &nbsp;= " + money(spend) + " ÷ " + leads + " leads &nbsp;= <b>" + money(cpl) + "</b><br>" +
          "CPConv = " + money(spend) + " ÷ " + custs + " customers = <b>" + money(cpc) + "</b><br>" +
          "Gross profit/customer = " + money(order || price) + " × " + (marginPct * 100).toFixed(1) + "% margin = <b>" + money(gpPerCustomer) + "</b><br>" +
          "Verdict = " + money(gpPerCustomer) + " − " + money(cpc) + " = <b>" + money(gpPerCustomer - cpc) + "</b> per customer" +
          '</p>';
        out.appendChild(steps);
      }
    }
    paint();
  }

      ["Colours", Object.values(B.colours).join(" · ")],
      ["Fonts", [B.fonts.headline, B.fonts.body, B.fonts.accent].map(f => (FONTS.find(x => x.id === f) || {}).name).join(" / ")],
      ["Mission", filled(B.mission.who) ? "We help " + B.mission.who + " to " + B.mission.what + " by " + B.mission.how + "." : ""],
      ["Vision", B.vision],
      ["Core values", B.values.filter(x => filled(x.name)).map(x => x.name).join(", ")],
      ["Target audience", B.persona.name ? B.persona.name + ", " + (B.persona.age || "?") + " — " + (B.persona.needs || "") : ""],
      ["Customer persona", B.persona.frustrates],
      ["Cost per unit", cost > 0 ? money(cost) : ""],
      ["Price", price > 0 ? money(price) + " (" + (B.price.method || "method not set") + ")" : ""],
      ["Gross profit", price > 0 ? money(gp) + (gm ? " · " + gm + " margin" : "") : ""],
      ["Awareness strategy", B.awareness.join(", ")],
      ["Consideration strategy", B.consideration.join(", ")],
      ["Conversion", B.cta.text],
      ["Marketing funnel", B.funnelNotes.filter(filled).length + " of 6 stages planned"],
      ["Cost per lead", leads > 0 ? money(spend / leads) : ""],
      ["Cost per conversion", custs > 0 ? money(spend / custs) : ""],
      ["CRM", B.crm.filter(r => filled(r.name)).length ? B.crm.filter(r => filled(r.name)).length + " people tracked" : ""],
      ["Automation", B.automation.filter(filled).length ? B.automation.filter(filled).length + " steps mapped" : ""],
      ["Community promise", B.community.promise],
      ["Policies", Object.keys(B.policies).filter(k => filled(B.policies[k])).length + " of 5 written"]
    ];

    const grid = el("div", "bp");
    grid.style.marginTop = "1.1rem";
    items.forEach(([k, val]) => {
      grid.appendChild(el("div", "bpc" + (filled(val) ? "" : " empty"),
        "<h4>" + esc(k) + "</h4><p>" + esc(filled(val) ? val : "Not filled in yet") + "</p>"));
    });
    v.appendChild(grid);

    const done = items.filter(([, val]) => filled(val)).length;
    const bar = el("div", "verdict " + (done === items.length ? "good" : "idle"));
    bar.style.marginTop = "1rem";
    bar.innerHTML = "<span><b>" + done + " of " + items.length + " sections complete.</b> " +
      (done === items.length ? "Your blueprint is finished — take it to the Founder Passport." : "Empty cards above show what is left.") + "</span>";
    v.appendChild(bar);

    const launch = el("div", "card");
    launch.style.marginTop = "1rem";
    launch.style.borderColor = "var(--energy)";
    launch.appendChild(field("My launch plan — the first real thing I will do, and when", "This earns the 🚀 LAUNCH stamp. Make it small enough to start this week.",
      () => B.launch, x => B.launch = x, { area:true, rows:2, placeholder:"On Saturday I will…" }));
    v.appendChild(launch);

    const pr = el("button", "btn ghost noprint", ic("i-print") + "Print my blueprint");
    pr.style.marginTop = "1rem";
    pr.addEventListener("click", () => window.print());
    v.appendChild(pr);
  }

  /* -------- part 14: passport -------- */
  function vPassport(v) {
    header(v, "Part 14", "GO OVERSEAS!", "This was never about operating internationally. It means: take your idea beyond your notebook, beyond your classroom, and into the real world.");

    const c = stampChecks();
    c.launch = STAMPS.slice(0, 9).every(([k]) => c[k]) && filled(B.launch);

    const pp = el("div", "passport");
    pp.style.marginTop = "1.3rem";
    pp.innerHTML = '<div class="pp-top"><div><div class="pp-sub">Little Founders · Founder CEO</div>' +
      '<div class="pp-title">FOUNDER PASSPORT</div></div>' +
      '<div class="pp-sub">' + stampCount() + ' / 10 stamps</div></div>';
    const st = el("div", "stamps");
    STAMPS.forEach(([k, em, label, note]) => {
      const d = el("div", "stamp" + (B.stamps[k] ? " got" : ""));
      d.innerHTML = '<span class="em">' + em + '</span><b>' + esc(label) + '</b><small>' + esc(note) + '</small>';
      st.appendChild(d);
    });
    pp.appendChild(st);
    v.appendChild(pp);

    if (stampCount() < 10) {
      const todo = el("div", "card");
      todo.style.marginTop = "1rem";
      todo.innerHTML = '<span class="lbl">Still to earn</span>';
      const list = el("div", "checks");
      list.style.marginTop = ".6rem";
      STAMPS.forEach(([k, em, label, note], i) => {
        if (B.stamps[k]) return;
        const b = el("button", "chk");
        b.setAttribute("aria-pressed", "false");
        b.innerHTML = '<span class="box">' + ic("i-check") + '</span><span><b>' + em + " " + esc(label) + '</b><span>' + esc(note) + '</span></span>';
        const target = ["idea","identity","beliefs","audience","price","notice","crm","automation","community","blueprint"][i];
        b.addEventListener("click", () => go(target));
        list.appendChild(b);
      });
      todo.appendChild(list);
      v.appendChild(todo);
    } else {
      const cert = el("div", "certificate");
      const today = new Date().toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
      cert.innerHTML =
        '<p class="eyebrow">Little Founders · Founder CEO · Ages 14–17</p>' +
        '<h2>👑 Certified Founder CEO</h2>' +
        '<p>Awarded to</p>' +
        '<p class="who">' + esc(B.founder || "…………………") + '</p>' +
        '<p>who took an idea from a blank page to a complete brand — named it, gave it a purpose, priced it, found its customer, built its funnel, tracked its numbers, and made a plan to launch it into the world.</p>' +
        '<p style="font-family:var(--display);font-weight:800">' + esc(B.chosenName || "Their brand") + '</p>' +
        '<div class="sig"><div><hr><span>Founder</span></div><div><hr><span>' + esc(today) + '</span></div></div>' +
        '<p class="align">Presented at the Little Founders Investor Panel · Founder Finale</p>';
      v.appendChild(cert);

      const pr = el("button", "btn noprint", ic("i-print") + "Print my certificate");
      pr.style.marginTop = "1rem";
      pr.addEventListener("click", () => window.print());
      v.appendChild(pr);
    }

    const finale = el("div", "card");
    finale.style.marginTop = "1.2rem";
    finale.innerHTML = '<span class="lbl">The Founder Finale</span>' +
      '<p class="hint">Present your complete brand to the Little Founders Investor Panel: the one-sentence business, the brand card, who it is for, the numbers, and the one thing you are doing next. Five minutes. Bring the blueprint.</p>';
    v.appendChild(finale);
  }

  /* ===================== wiring ===================== */

  $("menuBtn").addEventListener("click", () => {
    const r = $("rail");
    r.classList.add("open");
    const sc = el("div", "scrim");
    sc.addEventListener("click", () => { r.classList.remove("open"); sc.remove(); });
    document.body.appendChild(sc);
  });

  load();
  refreshStamps(true);
  go("start");
})();
</script>
