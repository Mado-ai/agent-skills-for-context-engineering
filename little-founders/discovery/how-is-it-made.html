<title>How Is It Made?</title>
<style>
  :root {
    --ground: #F7F4EC;
    --paper: #FFFFFF;
    --soft: #F2EEE2;
    --ink: #0D1B3D;
    --ink-soft: #3E4E76;
    --ink-mute: #7B87A5;
    --rule: #E3DCCA;

    --sun: #FFC83D;
    --energy: #FF7A1A;
    --sky: #4DB6F2;
    --teal: #00B9A7;
    --rose: #E0526E;
    --purple: #7B5EA6;
    --green: #5FA63F;
    --navy: #0D1B3D;

    --on-sun: #0D1B3D;
    --on-energy: #FFFFFF;
    --on-sky: #0D1B3D;
    --on-teal: #FFFFFF;
    --on-rose: #FFFFFF;
    --on-purple: #FFFFFF;
    --on-green: #FFFFFF;
    --on-navy: #F7F4EC;

    --shadow: 0 2px 4px rgba(22,35,63,.06), 0 12px 28px -14px rgba(22,35,63,.3);
    --shadow-lg: 0 4px 10px rgba(22,35,63,.09), 0 26px 56px -22px rgba(22,35,63,.45);

    --display: "Nunito", ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0A1428;
      --paper: #132244;
      --soft: #1A2B52;
      --ink: #F3F0E7;
      --ink-soft: #C6CFE7;
      --ink-mute: #919DBE;
      --rule: #27375F;
      --sun: #FFD264;
      --energy: #FF9247;
      --sky: #71C5F7;
      --teal: #1ACFBB;
      --rose: #F0798F;
      --purple: #A78BCE;
      --green: #6BC074;
      --navy: #C3CFEE;
      --on-sun: #16233F;
      --on-energy: #23150A;
      --on-sky: #0A1428;
      --on-teal: #03231F;
      --on-rose: #2A0B12;
      --on-purple: #190F29;
      --on-green: #06210B;
      --on-navy: #0A1428;
      --shadow: 0 2px 4px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.8);
      --shadow-lg: 0 4px 10px rgba(0,0,0,.45), 0 28px 60px -24px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0A1428; --paper: #132244; --soft: #1A2B52;
    --ink: #F3F0E7; --ink-soft: #C6CFE7; --ink-mute: #919DBE; --rule: #27375F;
    --sun: #FFD264; --energy: #FF9247; --sky: #71C5F7; --teal: #1ACFBB;
    --rose: #F0798F; --purple: #A78BCE; --green: #6BC074; --navy: #C3CFEE;
    --on-sun: #16233F; --on-energy: #23150A; --on-sky: #0A1428; --on-teal: #03231F;
    --on-rose: #2A0B12; --on-purple: #190F29; --on-green: #06210B; --on-navy: #0A1428;
    --shadow: 0 2px 4px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.8);
    --shadow-lg: 0 4px 10px rgba(0,0,0,.45), 0 28px 60px -24px rgba(0,0,0,.9);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); font-size: 1.05rem; line-height: 1.6;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }

  h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; }
  p { margin: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; font-family: var(--display); }
  :focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; border-radius: 10px; }

  .ic { width: 1.4em; height: 1.4em; flex: none; }

  /* ---------------- top bar ---------------- */

  .bar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
    padding: .7rem clamp(.9rem, 3vw, 2rem);
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rule);
  }
  .logo { display: flex; align-items: center; gap: .5rem; margin-right: auto; }
  .logo svg { width: 26px; height: 36px; }
  .logo b { font-family: var(--display); font-weight: 800; font-size: .95rem; line-height: 1; }
  .logo span { display: block; font-family: var(--body); font-size: .58rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; color: var(--teal); margin-top: .2rem; }

  .stars-meter {
    display: flex; align-items: center; gap: .35rem;
    background: var(--paper); border: 2px solid var(--rule); border-radius: 99px;
    padding: .3rem .8rem; font-family: var(--display); font-weight: 800;
    font-variant-numeric: tabular-nums; box-shadow: var(--shadow);
  }
  .stars-meter .ic { color: var(--sun); width: 1.15rem; height: 1.15rem; }
  .stars-meter.pop { animation: pop .5s cubic-bezier(.3,1.4,.5,1); }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.25) rotate(-4deg)} 100%{transform:scale(1)} }

  .chipbtn {
    display: inline-flex; align-items: center; gap: .45rem;
    padding: .45rem .9rem; border-radius: 99px; font-weight: 800; font-size: .9rem;
    background: var(--paper); border: 2px solid var(--rule); box-shadow: var(--shadow);
    transition: transform .12s ease, background .12s ease;
  }
  .chipbtn:hover { transform: translateY(-2px); }
  .chipbtn.on { background: var(--sun); color: var(--on-sun); border-color: var(--sun); }

  /* ---------------- layout ---------------- */

  .page { max-width: 62rem; margin: 0 auto; padding: clamp(1.1rem, 3vw, 2.4rem) clamp(.9rem, 3vw, 2rem) 5rem; }

  .card {
    background: var(--paper); border: 2px solid var(--rule);
    border-radius: 24px; padding: clamp(1.1rem, 3vw, 1.7rem);
    box-shadow: var(--shadow);
  }

  .stack { display: grid; gap: 1.1rem; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .6rem;
    padding: .85rem 1.5rem; border-radius: 16px;
    font-weight: 800; font-size: 1.05rem;
    background: var(--energy); color: var(--on-energy);
    box-shadow: var(--shadow); transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .btn:active { transform: translateY(0); }
  .btn.ghost { background: var(--paper); color: var(--ink); border: 2px solid var(--rule); }
  .btn.big { padding: 1.05rem 2rem; font-size: 1.2rem; border-radius: 20px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* ---------------- cover ---------------- */

  .cover { text-align: center; display: grid; gap: 1.4rem; justify-items: center; padding-top: clamp(1rem, 5vw, 3rem); }
  .cover h1 { font-size: clamp(2.6rem, 10vw, 5.2rem); line-height: .95; }
  .cover .sub { font-family: var(--display); font-weight: 800; font-size: clamp(1.05rem, 3vw, 1.5rem); color: var(--purple); }
  .cover .band {
    display: inline-flex; align-items: center; gap: .5rem;
    background: var(--teal); color: var(--on-teal);
    padding: .5rem 1.2rem; border-radius: 99px; font-family: var(--display); font-weight: 800; font-size: .95rem;
  }
  .namefield {
    display: grid; gap: .5rem; justify-items: center; width: min(26rem, 100%);
  }
  .namefield label { font-family: var(--display); font-weight: 800; font-size: 1.05rem; }
  .namefield input {
    width: 100%; padding: .8rem 1.1rem; font: inherit; font-family: var(--display); font-weight: 700;
    text-align: center; border-radius: 16px; border: 3px dashed var(--rule);
    background: var(--paper); color: var(--ink);
  }
  .namefield input:focus { border-style: solid; border-color: var(--teal); outline: none; }

  .ziggy-hero { width: clamp(96px, 24vw, 150px); height: auto; filter: drop-shadow(0 10px 20px rgba(224,82,110,.25)); }

  .underline::after {
    content: ""; display: block; width: 4.5rem; height: 6px; border-radius: 99px;
    background: var(--sun); margin: .8rem auto 0;
  }
  .bandfoot {
    margin-top: 3rem; background: var(--navy); border-radius: 24px;
    padding: 1.3rem 1.6rem; display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; justify-content: center;
    font-family: var(--display); font-weight: 900; font-size: clamp(1.1rem, 3.4vw, 1.7rem);
  }
  .bandfoot i { font-style: normal; }
  @media print { .bandfoot { display: none } }

  .quote { font-family: var(--display); font-weight: 800; font-style: italic; color: var(--teal); }

  /* ---------------- ziggy speech ---------------- */

  .ziggy-say {
    display: grid; grid-template-columns: auto minmax(0,1fr); gap: 1rem; align-items: center;
    background: linear-gradient(100deg, color-mix(in srgb, var(--sun) 22%, var(--paper)), var(--paper));
    border: 2px solid color-mix(in srgb, var(--sun) 45%, var(--rule));
    border-radius: 22px; padding: 1rem 1.2rem;
  }
  .ziggy-say svg.zig { width: 62px; height: 62px; flex: none; }
  .ziggy-say p { font-family: var(--display); font-weight: 700; font-size: clamp(1.05rem, 2.6vw, 1.3rem); line-height: 1.35; }
  .ziggy-say .kicker { font-family: var(--body); font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--purple); margin-bottom: .25rem; }

  .speak {
    display: inline-flex; align-items: center; gap: .4rem; margin-top: .6rem;
    padding: .35rem .8rem; border-radius: 99px; font-size: .82rem; font-weight: 800;
    background: var(--paper); border: 2px solid var(--rule);
  }
  .speak.speaking { background: var(--teal); color: var(--on-teal); border-color: var(--teal); }

  /* ---------------- topic grid ---------------- */

  .topics { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  .topic {
    display: grid; grid-template-columns: 3.4rem minmax(0,1fr); gap: .9rem; align-items: center;
    background: var(--paper); border: 2px solid var(--rule); border-radius: 20px;
    padding: .9rem; text-align: left; box-shadow: var(--shadow);
    transition: transform .14s ease, box-shadow .14s ease;
    position: relative; overflow: hidden;
  }
  .topic:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .topic .badge {
    width: 3.4rem; height: 3.4rem; border-radius: 50%; display: grid; place-items: center;
  }
  .topic .badge .ic { width: 1.8rem; height: 1.8rem; }
  .topic b { font-family: var(--display); font-weight: 800; font-size: 1rem; display: block; line-height: 1.2; }
  .topic small { color: var(--ink-mute); font-size: .78rem; }
  .topic .got {
    position: absolute; top: .5rem; right: .6rem; color: var(--sun);
    width: 1.3rem; height: 1.3rem; opacity: 0; transform: scale(.4) rotate(-30deg);
    transition: opacity .3s ease, transform .4s cubic-bezier(.3,1.5,.5,1);
  }
  .topic.done .got { opacity: 1; transform: none; }
  .topic.done { border-color: var(--sun); }

  /* ---------------- pattern cards ---------------- */

  .pattern { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); }
  .pat {
    background: var(--paper); border: 2px solid var(--rule); border-radius: 18px;
    padding: .9rem 1rem; display: grid; grid-template-columns: auto minmax(0,1fr); gap: .8rem; align-items: center;
  }
  .pat b { font-family: var(--display); font-weight: 900; font-size: 1.6rem; color: var(--purple); line-height: 1; }
  .pat span { font-family: var(--display); font-weight: 700; font-size: .98rem; }

  /* ---------------- topic page ---------------- */

  .topic-head { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .topic-head .num {
    width: 3.6rem; height: 3.6rem; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--display); font-weight: 900; font-size: 1.6rem;
  }
  .topic-head h2 { font-size: clamp(1.6rem, 5vw, 2.4rem); }

  .sec-label {
    display: flex; align-items: center; gap: .5rem;
    font-family: var(--body); font-size: .74rem; font-weight: 800;
    letter-spacing: .12em; text-transform: uppercase; color: var(--teal); margin-bottom: .7rem;
  }
  .sec-label .ic { width: 1rem; height: 1rem; }

  /* journey */
  .journey-wrap { position: relative; }
  .journey {
    display: flex; align-items: stretch; gap: .4rem; flex-wrap: wrap;
    padding: .3rem 0;
  }
  .stage {
    display: grid; gap: .35rem; justify-items: center; width: 5.6rem;
    opacity: 0; transform: translateY(14px) scale(.85);
    transition: opacity .35s ease, transform .45s cubic-bezier(.25,1.4,.5,1);
  }
  .stage.in { opacity: 1; transform: none; }
  .stage .puck {
    width: 3.6rem; height: 3.6rem; border-radius: 50%; display: grid; place-items: center;
    box-shadow: var(--shadow);
  }
  .stage .puck .ic { width: 2rem; height: 2rem; }
  .stage span { font-family: var(--display); font-weight: 800; font-size: .78rem; text-align: center; line-height: 1.15; }
  .arrow {
    display: grid; place-items: center; color: var(--ink-mute); width: 1.4rem;
    opacity: 0; transition: opacity .3s ease .1s;
    align-self: center; margin-bottom: 1rem;
  }
  .arrow.in { opacity: 1; }
  .arrow svg { width: 1.1rem; height: 1.1rem; }
  .arrow { color: var(--teal); }

  .journey-controls { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .9rem; align-items: center; }
  .hint { color: var(--ink-mute); font-size: .84rem; }

  /* steps */
  .steps { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
  .step {
    background: var(--paper); border: 2px solid var(--rule); border-radius: 18px; padding: 1rem;
    display: grid; gap: .6rem; text-align: left; align-content: start;
    transition: transform .14s ease, border-color .14s ease;
  }
  .step:hover { transform: translateY(-2px); }
  .step .n {
    width: 2.1rem; height: 2.1rem; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--display); font-weight: 900; font-size: .95rem;
  }
  .step p { font-size: .98rem; line-height: 1.45; }
  .step.opened { border-color: color-mix(in srgb, var(--teal) 60%, var(--rule)); }
  .step .veil { color: var(--ink-mute); font-family: var(--display); font-weight: 800; }

  /* helpers + fact */
  .two { display: grid; gap: 1.1rem; }
  @media (min-width: 46rem) { .two { grid-template-columns: 1fr 1fr; } }

  .helpers { display: flex; flex-wrap: wrap; gap: .5rem; }
  .helper {
    background: color-mix(in srgb, var(--sky) 20%, var(--paper));
    border: 2px solid color-mix(in srgb, var(--sky) 35%, var(--rule));
    padding: .45rem .9rem; border-radius: 99px; font-family: var(--display); font-weight: 800; font-size: .9rem;
  }
  .fact {
    background: color-mix(in srgb, var(--sun) 26%, var(--paper));
    border: 2px solid color-mix(in srgb, var(--sun) 55%, var(--rule));
    border-radius: 20px; padding: 1rem 1.1rem;
  }
  .fact b { font-family: var(--display); font-weight: 800; font-size: 1.02rem; line-height: 1.35; display: block; }

  /* words */
  .words { display: grid; gap: .5rem; }
  .word {
    display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: .7rem; align-items: center;
    background: color-mix(in srgb, var(--teal) 12%, var(--paper));
    border: 2px solid color-mix(in srgb, var(--teal) 30%, var(--rule));
    border-radius: 16px; padding: .7rem .9rem; text-align: left; width: 100%;
  }
  .word b { font-family: var(--display); font-weight: 800; color: var(--teal); }
  .word span { color: var(--ink-soft); font-size: .95rem; }
  .word .ic { color: var(--ink-mute); width: 1.1rem; height: 1.1rem; }
  .word.locked { background: var(--soft); border-color: var(--rule); opacity: .55; }
  .word.locked b { color: var(--ink-mute); }

  /* draw */
  .draw-box {
    border-left: 6px solid var(--purple);
    background: color-mix(in srgb, var(--purple) 10%, var(--paper));
    border-radius: 20px; padding: 1.1rem 1.2rem; display: grid; gap: .9rem;
  }
  .draw-box .prompt { font-family: var(--display); font-weight: 800; font-size: clamp(1.02rem, 2.5vw, 1.2rem); line-height: 1.35; }
  .canvas-shell {
    position: relative; border-radius: 18px; overflow: hidden;
    border: 3px dashed color-mix(in srgb, var(--purple) 40%, var(--rule));
    background: var(--paper); touch-action: none;
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }
  .canvas-empty {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    color: var(--ink-mute); font-family: var(--display); font-weight: 800; font-size: 1rem;
  }
  .tools { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; }
  .swatch {
    width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 3px solid var(--paper);
    box-shadow: 0 0 0 2px var(--rule); transition: transform .12s ease;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); transform: scale(1.14); }
  .sizes { display: flex; gap: .3rem; margin-left: .3rem; }
  .sizebtn { width: 2.2rem; height: 2.2rem; border-radius: 12px; border: 2px solid var(--rule); display: grid; place-items: center; background: var(--paper); }
  .sizebtn[aria-pressed="true"] { border-color: var(--ink); background: var(--soft); }
  .sizebtn i { display: block; border-radius: 50%; background: var(--ink); }

  .idea-name {
    width: 100%; padding: .7rem 1rem; font: inherit; font-family: var(--display); font-weight: 700;
    border-radius: 14px; border: 2px solid var(--rule); background: var(--paper); color: var(--ink);
  }
  .idea-name:focus { border-color: var(--purple); outline: none; }

  /* star award */
  .star-award {
    display: flex; align-items: center; gap: .9rem; flex-wrap: wrap;
    background: color-mix(in srgb, var(--sun) 24%, var(--paper));
    border: 2px solid var(--sun); border-radius: 20px; padding: 1rem 1.2rem;
  }
  .star-award .ic { width: 2.2rem; height: 2.2rem; color: var(--sun); }
  .star-award b { font-family: var(--display); font-weight: 800; font-size: 1.1rem; }

  /* nav footer */
  .pagenav { display: flex; gap: .7rem; flex-wrap: wrap; justify-content: space-between; margin-top: 1.4rem; }

  /* founder card */
  .fc-field { display: grid; gap: .45rem; }
  .fc-field label { font-family: var(--display); font-weight: 800; font-size: 1rem; }
  .fc-field input, .fc-field textarea {
    width: 100%; padding: .7rem 1rem; font: inherit; border-radius: 14px;
    border: 2px solid var(--rule); background: var(--paper); color: var(--ink); resize: vertical;
  }
  .fc-field input:focus, .fc-field textarea:focus { border-color: var(--energy); outline: none; }
  .jbuild { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  .jbuild input {
    width: 7.5rem; text-align: center; padding: .6rem .5rem; border-radius: 14px;
    border: 2px dashed var(--rule); background: var(--paper); color: var(--ink);
    font-family: var(--display); font-weight: 800; font-size: .9rem;
  }

  /* certificate */
  .cert {
    background: var(--paper); border: 8px solid var(--sun); border-radius: 28px;
    padding: clamp(1.5rem, 5vw, 3rem); text-align: center; display: grid; gap: 1rem; justify-items: center;
    box-shadow: var(--shadow-lg);
  }
  .cert .eyebrow { font-family: var(--body); font-size: .72rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--teal); }
  .cert h2 { font-size: clamp(2rem, 7vw, 3.2rem); }
  .cert .who {
    font-family: var(--display); font-weight: 900; font-size: clamp(1.5rem, 5vw, 2.4rem);
    color: var(--energy); border-bottom: 3px dotted var(--rule); padding: .2rem 2rem .4rem;
  }
  .cert .sig { display: flex; gap: 2.5rem; flex-wrap: wrap; justify-content: center; margin-top: 1rem; }
  .cert .sig div { min-width: 8rem; }
  .cert .sig hr { border: 0; border-top: 2px solid var(--ink); margin: 0 0 .3rem; }
  .cert .sig span { font-family: var(--display); font-weight: 800; font-size: .85rem; }
  .cert .align { font-size: .74rem; color: var(--ink-mute); }

  .gallery { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); }
  .gal { border: 2px solid var(--rule); border-radius: 16px; overflow: hidden; background: #fff; }
  .gal img { display: block; width: 100%; height: auto; }
  .gal figcaption { padding: .45rem .6rem; font-family: var(--display); font-weight: 800; font-size: .8rem; color: var(--ink); background: var(--paper); }

  /* confetti */
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
  .confetti i {
    position: absolute; width: 10px; height: 14px; border-radius: 2px;
    animation: fall 2.2s cubic-bezier(.3,.6,.5,1) forwards;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    .stage { opacity: 1; transform: none; }
    .arrow { opacity: 1; }
  }

  @media print {
    .bar, .pagenav, .noprint { display: none !important; }
    body { background: #fff; }
    .cert { box-shadow: none; border-color: #FFC83D; }
  }

  /* ---- brand: gold rule with a centred star (from the brand board) ---- */
  .lf-div { display: flex; align-items: center; gap: .85rem; margin: 2.4rem 0; }
  .lf-div::before, .lf-div::after { content: ""; height: 2px; flex: 1; background: var(--sun); opacity: .55; border-radius: 2px; }
  .lf-div svg { width: 1.05rem; height: 1.05rem; color: var(--sun); flex: none; }
  .lf-div.short::before, .lf-div.short::after { max-width: 8rem; }

  /* ---- brand: quiet structural labels (the board sets these in muted, not accent) ---- */
  .lf-quiet { color: var(--ink-mute); }

  /* ---- brand: drifting graphic elements ---- */
  .lf-deco { position: absolute; pointer-events: none; opacity: .5; }

  /* Play-the-game link in the top bar */
  .lf-play{display:inline-flex;align-items:center;gap:.42rem;text-decoration:none;cursor:pointer;
    font:inherit;font-size:.78rem;font-weight:800;letter-spacing:.01em;
    padding:.42rem .8rem;border-radius:999px;white-space:nowrap;
    border:2px solid color-mix(in srgb,var(--sun) 60%,var(--rule,#DDD6C4));
    background:color-mix(in srgb,var(--sun) 18%,var(--paper));color:var(--ink)}
  .lf-play:hover{background:color-mix(in srgb,var(--sun) 34%,var(--paper))}
  .lf-play em{font-style:normal;font-size:.95rem;line-height:1}
</style>

<script>
/* ===================================================================
   Little Founders — student layer
   Every book stores one saved copy per student, so a shared classroom
   device carries a whole class. The roster is shared between books.
   =================================================================== */
window.LF = (function () {
  "use strict";

  var RKEY = "lf-roster-v1", AKEY = "lf-active-student-v1";
  var roster = [], active = null;
  var cfg = { book: "book", title: "This book", onSwitch: null, progress: null };

  function uid() { return "s" + Math.random().toString(36).slice(2, 9); }

  function readAll() {
    try { roster = JSON.parse(localStorage.getItem(RKEY) || "[]") || []; } catch (e) { roster = []; }
    if (!Array.isArray(roster)) roster = [];
    try { active = localStorage.getItem(AKEY); } catch (e) { active = null; }
    if (!roster.length) { var id = uid(); roster = [{ id: id, name: "" }]; active = id; persist(); }
    if (!roster.some(function (s) { return s.id === active; })) { active = roster[0].id; persist(); }
  }
  function persist() {
    try {
      localStorage.setItem(RKEY, JSON.stringify(roster));
      localStorage.setItem(AKEY, active);
    } catch (e) {}
  }

  function current() { return roster.filter(function (s) { return s.id === active; })[0] || roster[0]; }
  function label() { var s = current(); return (s && s.name && s.name.trim()) || "Unnamed student"; }
  function key(base) { return base + "::" + active; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* progress for one student in this book, 0–100 */
  function pctFor(id) {
    if (!cfg.progress) return null;
    try {
      var raw = localStorage.getItem(cfg.book + "::" + id);
      if (!raw) return 0;
      var v = cfg.progress(JSON.parse(raw));
      return Math.max(0, Math.min(100, Math.round(v || 0)));
    } catch (e) { return 0; }
  }

  /* ------------------------------------------------------------- styles */
  function injectCSS() {
    if (document.getElementById("lf-student-css")) return;
    var css = document.createElement("style");
    css.id = "lf-student-css";
    css.textContent = [
      ".lf-who{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .55rem .4rem .4rem;border-radius:99px;",
      "border:2px solid var(--rule,#E3DCCA);background:var(--paper,#fff);font-family:var(--display,system-ui);",
      "font-weight:800;font-size:.86rem;cursor:pointer;transition:transform .12s ease}",
      ".lf-who:hover{transform:translateY(-1px)}",
      ".lf-who .lf-av{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;",
      "background:var(--energy,#FF7A1A);color:#fff;font-size:.8rem;flex:none}",
      ".lf-who .lf-caret{opacity:.5;font-size:.7rem}",
      ".lf-scrim{position:fixed;inset:0;background:rgba(13,27,61,.55);z-index:200;display:grid;place-items:center;padding:1rem;",
      "animation:lfFade .2s ease}",
      "@keyframes lfFade{from{opacity:0}}",
      ".lf-panel{background:var(--paper,#fff);color:var(--ink,#0D1B3D);border-radius:22px;max-width:34rem;width:100%;",
      "max-height:86vh;overflow:auto;padding:1.4rem 1.5rem;box-shadow:0 30px 70px -30px rgba(0,0,0,.7);",
      "border:1px solid var(--rule,#E3DCCA);font-family:var(--body,system-ui)}",
      ".lf-panel h2{font-family:var(--display,system-ui);font-weight:800;font-size:1.3rem;margin:0 0 .2rem}",
      ".lf-panel .lf-sub{color:var(--ink-mute,#7B87A5);font-size:.86rem;margin-bottom:1.1rem}",
      ".lf-row{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto auto;gap:.6rem;align-items:center;",
      "padding:.5rem;border-radius:14px;border:2px solid var(--rule,#E3DCCA);margin-bottom:.45rem}",
      ".lf-row.on{border-color:var(--teal,#00B9A7);background:color-mix(in srgb,var(--teal,#00B9A7) 8%,transparent)}",
      ".lf-row .lf-av{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;color:#fff;",
      "font-family:var(--display,system-ui);font-weight:800;font-size:.9rem}",
      ".lf-row input{width:100%;border:0;background:none;font:inherit;font-family:var(--display,system-ui);font-weight:700;",
      "color:inherit;padding:.2rem 0}",
      ".lf-row input:focus{outline:none;border-bottom:2px solid var(--teal,#00B9A7)}",
      ".lf-bar{width:4.5rem;height:8px;border-radius:99px;background:var(--sunk,#EEE9DA);overflow:hidden;flex:none}",
      ".lf-bar i{display:block;height:100%;background:var(--teal,#00B9A7);border-radius:99px}",
      ".lf-pct{font-size:.72rem;color:var(--ink-mute,#7B87A5);font-variant-numeric:tabular-nums;min-width:2.4rem;text-align:right}",
      ".lf-mini{display:flex;align-items:center;gap:.4rem}",
      ".lf-x{width:1.9rem;height:1.9rem;border-radius:50%;border:2px solid var(--rule,#E3DCCA);display:grid;place-items:center;",
      "background:none;cursor:pointer;color:var(--ink-mute,#7B87A5);font-size:.9rem;line-height:1}",
      ".lf-x:hover{color:#D0455C;border-color:#D0455C}",
      ".lf-acts{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}",
      ".lf-btn{padding:.6rem 1.1rem;border-radius:13px;font-family:var(--display,system-ui);font-weight:800;font-size:.9rem;",
      "border:0;cursor:pointer;background:var(--energy,#FF7A1A);color:#fff}",
      ".lf-btn.ghost{background:transparent;color:inherit;border:2px solid var(--rule,#E3DCCA)}",
      ".lf-note{font-size:.8rem;color:var(--ink-mute,#7B87A5);margin-top:1rem;line-height:1.5}"
    ].join("");
    document.head.appendChild(css);
  }

  /* ------------------------------------------------------------- chip */
  var chip;
  function paintChip() {
    if (!chip) return;
    var n = label();
    chip.innerHTML = '<span class="lf-av">' + esc(n.trim().charAt(0).toUpperCase() || "?") + "</span>" +
      "<span>" + esc(n) + '</span><span class="lf-caret">▾</span>';
    chip.setAttribute("aria-label", "Current student: " + n + ". Change student.");
  }
  function mountChip() {
    var host = document.querySelector(".bar, .topline");
    if (!host) return;
    chip = document.createElement("button");
    chip.className = "lf-who";
    chip.type = "button";
    chip.addEventListener("click", openPanel);
    host.appendChild(chip);
    paintChip();
  }

  /* ------------------------------------------------------------- panel */
  function openPanel() {
    var scrim = document.createElement("div");
    scrim.className = "lf-scrim";
    var panel = document.createElement("div");
    panel.className = "lf-panel";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-label", "Choose student");
    scrim.appendChild(panel);

    function draw() {
      var cols = ["#FF7A1A", "#00B9A7", "#4DB6F2", "#7B5EA6", "#5FA63F", "#E0526E", "#FFC83D"];
      panel.innerHTML = "<h2>Who is using this?</h2>" +
        '<p class="lf-sub">' + esc(cfg.title) + " keeps a separate copy of the work for every student on this device.</p>";

      roster.forEach(function (s, i) {
        var row = document.createElement("div");
        row.className = "lf-row" + (s.id === active ? " on" : "");

        var av = document.createElement("span");
        av.className = "lf-av";
        av.style.background = cols[i % cols.length];
        av.textContent = (s.name || "?").trim().charAt(0).toUpperCase() || "?";
        row.appendChild(av);

        var nameWrap = document.createElement("div");
        var input = document.createElement("input");
        input.type = "text";
        input.value = s.name || "";
        input.placeholder = "Student name";
        input.setAttribute("aria-label", "Student name");
        input.addEventListener("input", function () {
          s.name = input.value.slice(0, 40); persist(); paintChip();
          av.textContent = (s.name || "?").trim().charAt(0).toUpperCase() || "?";
        });
        nameWrap.appendChild(input);
        row.appendChild(nameWrap);

        var pct = pctFor(s.id);
        var mini = document.createElement("div");
        mini.className = "lf-mini";
        if (pct !== null) {
          mini.innerHTML = '<span class="lf-bar"><i style="width:' + pct + '%"></i></span>' +
            '<span class="lf-pct">' + pct + "%</span>";
        }
        row.appendChild(mini);

        var right = document.createElement("div");
        right.className = "lf-mini";
        if (s.id !== active) {
          var use = document.createElement("button");
          use.className = "lf-btn ghost";
          use.style.padding = ".35rem .8rem";
          use.style.fontSize = ".8rem";
          use.textContent = "Use";
          use.addEventListener("click", function () {
            active = s.id; persist(); paintChip();
            if (cfg.onSwitch) cfg.onSwitch();
            close();
          });
          right.appendChild(use);
        }
        if (roster.length > 1) {
          var del = document.createElement("button");
          del.className = "lf-x";
          del.type = "button";
          del.innerHTML = "✕";
          del.setAttribute("aria-label", "Remove " + (s.name || "student") + " and their work");
          del.addEventListener("click", function () {
            if (!confirm("Remove " + (s.name || "this student") + "? Their saved work in every book is deleted and cannot be recovered.")) return;
            try {
              for (var k = localStorage.length - 1; k >= 0; k--) {
                var kk = localStorage.key(k);
                if (kk && kk.indexOf("::" + s.id) > -1) localStorage.removeItem(kk);
              }
            } catch (e) {}
            roster = roster.filter(function (x) { return x.id !== s.id; });
            if (active === s.id) { active = roster[0].id; if (cfg.onSwitch) cfg.onSwitch(); }
            persist(); paintChip(); draw();
          });
          right.appendChild(del);
        }
        row.appendChild(right);
        panel.appendChild(row);
      });

      var acts = document.createElement("div");
      acts.className = "lf-acts";
      var add = document.createElement("button");
      add.className = "lf-btn";
      add.textContent = "+ Add a student";
      add.addEventListener("click", function () {
        var id = uid();
        roster.push({ id: id, name: "" });
        active = id; persist(); paintChip();
        if (cfg.onSwitch) cfg.onSwitch();
        draw();
      });
      var done = document.createElement("button");
      done.className = "lf-btn ghost";
      done.textContent = "Done";
      done.addEventListener("click", close);
      acts.appendChild(add); acts.appendChild(done);
      panel.appendChild(acts);

      var note = document.createElement("p");
      note.className = "lf-note";
      note.textContent = "The class list is shared across all four Little Founders books, so a student keeps the same name everywhere. " +
        "Work is saved in this browser only — it does not follow a student to another device.";
      panel.appendChild(note);
    }

    function close() { scrim.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e) { if (e.key === "Escape") close(); }
    scrim.addEventListener("click", function (e) { if (e.target === scrim) close(); });
    document.addEventListener("keydown", onKey);

    draw();
    document.body.appendChild(scrim);
    var f = panel.querySelector("input");
    if (f && !f.value) f.focus();
  }

  /* ------------------------------------------------------------- api */
  function init(options) {
    cfg = Object.assign(cfg, options || {});
    readAll();
    injectCSS();
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mountChip);
    else mountChip();
  }

  return {
    init: init,
    key: key,
    name: label,
    activeId: function () { return active; },
    roster: function () { return roster.slice(); },
    open: openPanel,
    refresh: function () { paintChip(); }
  };
})();
</script>

  const canSpeak = typeof speechSynthesis !== "undefined";

  /* ===================== drawing pad ===================== */

  function makePad(host, storeKey, w, h) {
    const shell = el("div", "canvas-shell");
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.setAttribute("role", "img");
    cv.setAttribute("aria-label", "Drawing area");
    shell.appendChild(cv);
    const empty = el("div", "canvas-empty", "Draw here with your finger or mouse");
    shell.appendChild(empty);

    const ctx = cv.getContext("2d");
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    let colour = INK[0], size = 6, drawing = false, dirty = false;
    const undoStack = [];

    function fillBg() { ctx.save(); ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, w, h); ctx.restore(); }
    fillBg();

    const saved = S.drawings[storeKey];
    if (saved) {
      const img = new Image();
      img.onload = () => { ctx.drawImage(img, 0, 0, w, h); dirty = true; empty.style.display = "none"; };
      img.src = saved;
    }

    function pos(e) {
      const r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (w / r.width), y: (e.clientY - r.top) * (h / r.height) };
    }
    function push() { try { undoStack.push(cv.toDataURL()); if (undoStack.length > 12) undoStack.shift(); } catch (e) {} }
    function persist() {
      try { S.drawings[storeKey] = cv.toDataURL("image/png"); save(); } catch (e) {}
    }

    cv.addEventListener("pointerdown", e => {
      e.preventDefault();
      cv.setPointerCapture(e.pointerId);
      push();
      drawing = true; dirty = true; empty.style.display = "none";
      const p = pos(e);
      ctx.strokeStyle = colour; ctx.lineWidth = size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + .01, p.y); ctx.stroke();
    });
    cv.addEventListener("pointermove", e => {
      if (!drawing) return;
      const p = pos(e);
      ctx.lineTo(p.x, p.y); ctx.stroke();
    });
    const end = () => { if (!drawing) return; drawing = false; persist(); host.dispatchEvent(new CustomEvent("drawn")); };
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);
    cv.addEventListener("pointerleave", end);

    const tools = el("div", "tools");
    INK.forEach((cRaw, i) => {
      const b = el("button", "swatch");
      b.style.background = cRaw;
      b.setAttribute("aria-label", "Colour " + (i + 1));
      b.setAttribute("aria-pressed", String(i === 0));
      b.addEventListener("click", () => {
        colour = cRaw;
        tools.querySelectorAll(".swatch").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
      });
      tools.appendChild(b);
    });
    const sizes = el("div", "sizes");
    [[4, "Thin"], [8, "Medium"], [16, "Thick"]].forEach(([sv, lbl], i) => {
      const b = el("button", "sizebtn", '<i style="width:' + Math.max(4, sv / 1.6) + 'px;height:' + Math.max(4, sv / 1.6) + 'px"></i>');
      b.setAttribute("aria-label", lbl + " brush");
      b.setAttribute("aria-pressed", String(i === 1));
      b.addEventListener("click", () => {
        size = sv;
        sizes.querySelectorAll(".sizebtn").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
      });
      sizes.appendChild(b);
    });
    size = 8;
    tools.appendChild(sizes);

    const undo = el("button", "chipbtn", ic("i-undo") + "Undo");
    undo.addEventListener("click", () => {
      const prev = undoStack.pop();
      if (!prev) return;
      const img = new Image();
      img.onload = () => { ctx.clearRect(0, 0, w, h); fillBg(); ctx.drawImage(img, 0, 0, w, h); persist(); };
      img.src = prev;
    });
    const clear = el("button", "chipbtn", ic("i-trash") + "Start again");
    clear.addEventListener("click", () => {
      push(); ctx.clearRect(0, 0, w, h); fillBg();
      dirty = false; empty.style.display = "grid";
      delete S.drawings[storeKey]; save();
    });
    tools.appendChild(undo); tools.appendChild(clear);

    host.appendChild(shell);
    host.appendChild(tools);
    return { hasInk: () => dirty };
  }

      TOPICS.forEach(t => {
        const d = S.drawings["t" + t.n];
        if (!d) return;
        const f = el("figure", "gal");
        f.innerHTML = '<img alt="My idea for ' + esc(t.title) + '" src="' + d + '"><figcaption>' +
          esc(S.ideas[t.n] || t.title.replace("How is ", "").replace("How does ", "")) + '</figcaption>';
        g.appendChild(f);
      });
      if (S.drawings["founder-card"]) {
        const f = el("figure", "gal");
        f.innerHTML = '<img alt="My founder card invention" src="' + S.drawings["founder-card"] + '"><figcaption>My big idea</figcaption>';
        g.appendChild(f);
      }
      p.appendChild(g);
    }
  }

  /* ===================== wiring ===================== */

  document.addEventListener("click", e => {
    const s = e.target.closest("[data-speak]");
    if (s) { speak(s.dataset.speak, s); return; }
    const n = e.target.closest("[data-nav]");
    if (n) go(n.dataset.nav);
  });

  LF.init({book:KEY,title:"How Is It Made?",progress:function(d){var st=Object.keys(d.stars||{}).length;return st/10*100;},
    onSwitch:function(){ S = { name:"", stars:{}, drawings:{}, ideas:{}, card:{}, seen:{} }; load(); view={name:"home",n:null}; updateMeter(); render(); }});
  load();
  updateMeter();
  render();
})();
</script>
