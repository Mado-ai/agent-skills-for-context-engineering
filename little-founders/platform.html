<title>Little Founders Learning Map</title>
<style>
  :root {
    --ground: #F7F4EC;
    --surface: #FFFFFF;
    --surface-2: #F3EFE3;
    --surface-3: #EAE4D4;
    --ink: #0D1B3D;
    --ink-soft: #43537D;
    --ink-mute: #7A86A8;
    --rule: #E2DBC9;
    --rule-soft: #EDE7D9;

    --sunshine: #FFC83D;
    --energy: #FF7A1A;
    --sky: #4DB6F2;
    --teal: #00B9A7;
    --navy: #0D1B3D;
    --green: #5FA63F;
    --purple: #7B5EA6;

    --on-sunshine: #0D1B3D;
    --on-energy: #FFFFFF;
    --on-sky: #0D1B3D;
    --on-teal: #FFFFFF;
    --on-navy: #F7F4EC;
    --on-green: #FFFFFF;
    --on-purple: #FFFFFF;

    --locked: #C9C2B0;
    --locked-ink: #8A8371;

    --shadow-1: 0 1px 2px rgba(13,27,61,.06), 0 6px 18px -10px rgba(13,27,61,.18);
    --shadow-2: 0 2px 6px rgba(13,27,61,.08), 0 18px 40px -18px rgba(13,27,61,.35);

    --display: "Nunito", ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;

    --r-md: 16px;
    --r-lg: 22px;
    --sidebar: 15.5rem;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #071022;
      --surface: #0F1C3C;
      --surface-2: #16244A;
      --surface-3: #1E2E5A;
      --ink: #F2EFE6;
      --ink-soft: #C4CDE5;
      --ink-mute: #8D9ABC;
      --rule: #253461;
      --rule-soft: #1B294F;
      --sunshine: #FFD264;
      --energy: #FF8F3D;
      --sky: #6EC4F7;
      --teal: #17CDBA;
      --navy: #B9C7EC;
      --green: #7EC65C;
      --purple: #A489CD;
      --on-sunshine: #0D1B3D;
      --on-energy: #26160A;
      --on-sky: #071022;
      --on-teal: #03231F;
      --on-navy: #071022;
      --on-green: #06210B;
      --on-purple: #180F28;
      --locked: #2B3763;
      --locked-ink: #6B78A0;
      --shadow-1: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px -12px rgba(0,0,0,.7);
      --shadow-2: 0 2px 8px rgba(0,0,0,.4), 0 22px 50px -20px rgba(0,0,0,.85);
    }
  }

  :root[data-theme="dark"] {
    --ground: #071022;
    --surface: #0F1C3C;
    --surface-2: #16244A;
    --surface-3: #1E2E5A;
    --ink: #F2EFE6;
    --ink-soft: #C4CDE5;
    --ink-mute: #8D9ABC;
    --rule: #253461;
    --rule-soft: #1B294F;
    --sunshine: #FFD264;
    --energy: #FF8F3D;
    --sky: #6EC4F7;
    --teal: #17CDBA;
    --navy: #B9C7EC;
    --green: #7EC65C;
    --purple: #A489CD;
    --on-sunshine: #0D1B3D;
    --on-energy: #26160A;
    --on-sky: #071022;
    --on-teal: #03231F;
    --on-navy: #071022;
    --on-green: #06210B;
    --on-purple: #180F28;
    --locked: #2B3763;
    --locked-ink: #6B78A0;
    --shadow-1: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px -12px rgba(0,0,0,.7);
    --shadow-2: 0 2px 8px rgba(0,0,0,.4), 0 22px 50px -20px rgba(0,0,0,.85);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: .95rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 { font-family: var(--display); font-weight: 800; letter-spacing: -.015em; margin: 0; line-height: 1.15; text-wrap: balance; }
  p { margin: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; border-radius: 6px; }

  .icon { width: 1.25em; height: 1.25em; flex: none; }

  /* ================= shell ================= */

  .app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }

  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--rule);
    padding: 1.4rem 1rem;
    display: flex; flex-direction: column; gap: 1.3rem;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }

  .brand { display: flex; align-items: center; gap: .6rem; padding: 0 .4rem; }
  .brand svg { width: 32px; height: 44px; flex: none; }
  .brand-name { font-family: var(--display); font-weight: 800; font-size: 1.1rem; line-height: 1.05; }
  .brand-sub { display: block; font-family: var(--body); font-size: .6rem; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; color: var(--energy); margin-top: .3rem; }

  nav { display: grid; gap: .15rem; }
  .nav-btn {
    display: flex; align-items: center; gap: .7rem;
    padding: .58rem .7rem; border-radius: 12px;
    color: var(--ink-soft); font-weight: 500; text-align: left; width: 100%;
  }
  .nav-btn:hover { background: var(--surface-2); color: var(--ink); }
  .nav-btn[aria-current="page"] { background: var(--surface-3); color: var(--ink); font-weight: 700; }
  .nav-btn[aria-current="page"] .icon { color: var(--energy); }

  .tier-pick { margin-top: auto; display: grid; gap: .45rem; }
  .tier-pick > span { font-size: .6rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-mute); padding: 0 .4rem; }
  .tier-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: .3rem; }
  .tier-btn {
    display: grid; gap: .1rem; justify-items: start;
    padding: .5rem .55rem; border-radius: 12px; text-align: left;
    border: 1px solid var(--rule); background: var(--surface-2);
    font-family: var(--display); font-weight: 700; font-size: .76rem; color: var(--ink-mute);
    line-height: 1.15;
  }
  .tier-btn:hover { color: var(--ink); }
  .tier-btn[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
  .tier-btn[aria-pressed="true"] .tier-dot { transform: scale(1.35); }
  .tier-top-row { display: flex; align-items: center; gap: .35rem; }
  .tier-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; transition: transform .15s ease; }
  .tier-age { font-family: var(--body); font-size: .62rem; font-weight: 500; color: var(--ink-mute); }

  /* ================= topbar ================= */

  main { min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: .8rem;
    padding: .85rem clamp(1rem, 3vw, 2rem);
    border-bottom: 1px solid var(--rule);
    background: var(--ground);
    position: sticky; top: 0; z-index: 20;
    flex-wrap: wrap;
  }
  .menu-btn { display: none; padding: .4rem; border-radius: 10px; }
  .topbar h1 { font-size: 1.05rem; margin-right: auto; }

  .meter {
    display: flex; align-items: center; gap: .4rem;
    background: var(--surface); border: 1px solid var(--rule);
    padding: .32rem .7rem; border-radius: 99px; font-weight: 700;
    font-family: var(--display); font-variant-numeric: tabular-nums;
    box-shadow: var(--shadow-1); white-space: nowrap;
  }
  .meter .icon { color: var(--sunshine); width: 1.05rem; height: 1.05rem; }
  .meter.streak .icon { color: var(--energy); }
  .meter small { font-family: var(--body); font-size: .66rem; font-weight: 600; color: var(--ink-mute); letter-spacing: .03em; text-transform: uppercase; }
  .meter.bump { animation: bump .45s ease; }
  @keyframes bump { 0%{transform:scale(1)} 35%{transform:scale(1.14)} 100%{transform:scale(1)} }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    background: var(--sunshine); color: var(--on-sunshine);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: .88rem;
  }

  .view { padding: clamp(1.1rem, 3vw, 2rem); display: grid; gap: 1.1rem; align-content: start; }

  /* ================= cards ================= */

  .card {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: var(--r-lg); padding: 1.2rem 1.3rem;
    box-shadow: var(--shadow-1);
  }
  .card > header { display: flex; align-items: baseline; justify-content: space-between; gap: .8rem; margin-bottom: 1rem; }
  .card h2 { font-size: 1.02rem; }
  .card h3 { font-size: .95rem; }
  .muted { color: var(--ink-mute); font-size: .8rem; }

  .grid { display: grid; gap: 1.1rem; }
  @media (min-width: 64rem) {
    .g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* hero */
  .hero {
    border: 1px solid var(--rule); border-radius: var(--r-lg);
    padding: 1.4rem; display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap;
    background: var(--surface-2);
  }
  .hero .big-avatar {
    width: 72px; height: 72px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.8rem;
    border: 3px solid var(--surface); box-shadow: var(--shadow-1);
  }
  .hero h2 { font-size: clamp(1.45rem, 3vw, 2rem); }
  .hero p { color: var(--ink-soft); margin-top: .25rem; }
  .facts { display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .85rem; }
  .fact {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
    padding: .35rem .7rem; font-size: .74rem;
  }
  .fact b { display: block; font-family: var(--display); font-size: .88rem; }
  .fact span { color: var(--ink-mute); font-size: .63rem; letter-spacing: .07em; text-transform: uppercase; }

  .tier-chip {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .3rem .7rem; border-radius: 99px;
    font-family: var(--display); font-weight: 800; font-size: .78rem;
  }
  .tier-chip .icon { width: 1rem; height: 1rem; }

  /* progress ring */
  .ring-wrap { display: flex; align-items: center; gap: 1rem; }
  .ring { width: 88px; height: 88px; flex: none; }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .bg { stroke: var(--surface-3); }
  .ring .fg { stroke: var(--teal); stroke-linecap: round; transition: stroke-dasharray .6s cubic-bezier(.3,.9,.3,1); }
  .ring text { font-family: var(--display); font-weight: 800; font-size: 21px; fill: var(--ink); }

  /* bars */
  .bars { display: grid; gap: .65rem; }
  .bar-row { display: grid; grid-template-columns: 1.3rem minmax(0,1fr) 2.5rem; gap: .55rem; align-items: center; font-size: .82rem; }
  .bar-row .icon { color: var(--ink-mute); }
  .bar-label { display: grid; gap: .28rem; min-width: 0; }
  .bar-label b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 7px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; transition: width .5s cubic-bezier(.3,.9,.3,1); }
  .bar-row em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--ink-mute); font-size: .76rem; text-align: right; }

  /* streak */
  .days { display: flex; gap: .28rem; margin-top: .8rem; }
  .day { flex: 1; display: grid; gap: .3rem; justify-items: center; font-size: .6rem; color: var(--ink-mute); }
  .dot { width: 100%; aspect-ratio: 1; max-width: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-mute); }
  .dot.on { background: var(--teal); color: var(--on-teal); }
  .streak-num { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; display: flex; align-items: center; gap: .4rem; }
  .streak-num .icon { width: 1.4rem; height: 1.4rem; color: var(--energy); }

  /* ================= learning map ================= */

  .map-layout { display: grid; gap: 1.1rem; }
  @media (min-width: 70rem) { .map-layout { grid-template-columns: minmax(0, 1fr) 20rem; align-items: start; } }

  .map {
    position: relative; border-radius: var(--r-lg);
    border: 1px solid var(--rule); background: var(--surface);
    overflow: hidden; box-shadow: var(--shadow-1);
    aspect-ratio: 16 / 10; min-height: 25rem;
  }
  .map-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map-path { fill: none; stroke: var(--surface-3); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .map-path.done { stroke: var(--teal); }

  .node {
    position: absolute; transform: translate(-50%, -50%);
    display: grid; justify-items: center; gap: .3rem; width: 8.5rem;
  }
  .node-btn {
    width: 3.3rem; height: 3.3rem; border-radius: 50%;
    display: grid; place-items: center; position: relative;
    border: 3px solid var(--surface); box-shadow: var(--shadow-1);
    background: var(--locked); color: var(--locked-ink);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .node-btn:hover, .node-btn:focus-visible { transform: translateY(-3px) scale(1.06); box-shadow: var(--shadow-2); }
  .node-btn .icon { width: 1.45rem; height: 1.45rem; }
  .node-num {
    position: absolute; top: -.35rem; left: -.35rem;
    width: 1.3rem; height: 1.3rem; border-radius: 50%;
    background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
    font-family: var(--display); font-weight: 800; font-size: .66rem;
    display: grid; place-items: center;
  }
  .node-name { font-family: var(--display); font-weight: 700; font-size: .7rem; text-align: center; line-height: 1.2;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: .18rem .4rem; }
  .node.is-locked .node-name { color: var(--ink-mute); }
  .node.is-current .node-btn { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: var(--shadow-1); } 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--energy) 22%, transparent); } }
  .node-stars { display: flex; gap: .08rem; }
  .node-stars .icon { width: .7rem; height: .7rem; color: var(--sunshine); }

  @media (max-width: 47.99rem) {
    .map { aspect-ratio: auto; min-height: 0; display: grid; gap: .45rem; padding: .9rem; }
    .map-bg { display: none; }
    .node { position: static; transform: none; width: auto; grid-template-columns: 3.3rem minmax(0,1fr); justify-items: start; align-items: center; gap: .8rem; }
    .node-name { text-align: left; border: 0; background: none; padding: 0; font-size: .88rem; }
    .node-stars { grid-column: 2; }
  }

  /* panel */
  .panel { display: grid; gap: .9rem; }
  .panel-head { border-radius: var(--r-md); padding: 1rem 1.1rem; display: grid; gap: .25rem; }
  .panel-head .kicker { font-size: .64rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; opacity: .85; }
  .panel-head h2 { font-size: 1.3rem; }
  .panel-head p { font-size: .8rem; opacity: .92; }

  .req { display: grid; gap: .4rem; }
  .req li { display: flex; align-items: center; gap: .6rem; font-size: .82rem; padding: .38rem .6rem; border-radius: 10px; background: var(--surface-2); }
  .req .icon { width: 1rem; height: 1rem; flex: none; }
  .req .met { color: var(--teal); }
  .req .unmet { color: var(--ink-mute); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    padding: .62rem 1.05rem; border-radius: 12px;
    font-family: var(--display); font-weight: 800; font-size: .88rem;
    background: var(--energy); color: var(--on-energy);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn:disabled { background: var(--surface-3); color: var(--ink-mute); cursor: not-allowed; transform: none; filter: none; }
  .btn.ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--rule); }
  .btn.small { padding: .36rem .75rem; font-size: .78rem; border-radius: 10px; }

  /* ================= sessions ================= */

  .sessions { display: grid; gap: .45rem; }
  .session {
    display: grid; grid-template-columns: 2.3rem minmax(0,1fr) auto; gap: .85rem; align-items: center;
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md);
    padding: .75rem .9rem;
  }
  .session.done { background: var(--surface-2); }
  .s-beat {
    width: 2.3rem; height: 2.3rem; border-radius: 10px; display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: .66rem;
  }
  .beat-Notice { background: color-mix(in srgb, var(--sunshine) 30%, var(--surface)); color: var(--ink); }
  .beat-Make { background: color-mix(in srgb, var(--energy) 26%, var(--surface)); color: var(--ink); }
  .beat-Show { background: color-mix(in srgb, var(--sky) 30%, var(--surface)); color: var(--ink); }
  .beat-Change { background: color-mix(in srgb, var(--teal) 28%, var(--surface)); color: var(--ink); }
  .s-body { min-width: 0; }
  .s-body b { display: block; font-weight: 600; }
  .s-body span { font-size: .78rem; color: var(--ink-mute); }
  .session.done .s-body b { text-decoration: line-through; text-decoration-color: var(--ink-mute); color: var(--ink-mute); }

  .check {
    width: 1.55rem; height: 1.55rem; border-radius: 50%; border: 2px solid var(--rule);
    display: grid; place-items: center; color: transparent; flex: none;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .check:hover { border-color: var(--teal); }
  .session.done .check { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
  .check .icon { width: .88rem; height: .88rem; }

  .milestone {
    display: flex; align-items: center; gap: .6rem; justify-content: center;
    padding: .65rem; border-radius: var(--r-md);
    background: color-mix(in srgb, var(--energy) 14%, var(--surface));
    border: 1px dashed var(--energy);
    font-family: var(--display); font-weight: 800; letter-spacing: .03em;
  }
  .milestone .icon { color: var(--energy); }

  /* ================= badges ================= */

  .badge-grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); }
  .badge {
    border: 1px solid var(--rule); border-radius: var(--r-md); padding: .85rem;
    background: var(--surface); display: grid; gap: .45rem; justify-items: center; text-align: center;
  }
  .badge-medal {
    width: 2.9rem; height: 2.9rem; border-radius: 14px; display: grid; place-items: center;
    background: var(--surface-3); color: var(--locked-ink);
  }
  .badge.earned .badge-medal { background: var(--sunshine); color: var(--on-sunshine); }
  .badge.earned.core .badge-medal { background: var(--energy); color: var(--on-energy); }
  .badge b { font-family: var(--display); font-size: .84rem; }
  .badge p { font-size: .7rem; color: var(--ink-mute); line-height: 1.35; }
  .badge:not(.earned) b { color: var(--ink-mute); }

  /* certification */
  .cert { display: grid; gap: .8rem; justify-items: center; text-align: center; padding: .4rem 0; }
  .cert-seal {
    width: 4.6rem; height: 4.6rem; border-radius: 50%; display: grid; place-items: center;
    border: 3px dashed var(--rule); color: var(--ink-mute);
  }
  .cert-seal .icon { width: 2rem; height: 2rem; }
  .cert.earned .cert-seal { border-style: solid; }
  .cert b { font-family: var(--display); font-size: 1.05rem; }

  /* toast */
  .toasts { position: fixed; right: 1rem; bottom: 1rem; display: grid; gap: .5rem; z-index: 60; }
  .toast {
    display: flex; align-items: center; gap: .7rem;
    background: var(--surface); border: 1px solid var(--rule); border-left: 5px solid var(--sunshine);
    border-radius: 12px; padding: .65rem .9rem; box-shadow: var(--shadow-2);
    animation: slide .3s cubic-bezier(.2,.9,.3,1); max-width: 20rem;
  }
  .toast b { font-family: var(--display); font-size: .86rem; display: block; }
  .toast span { font-size: .72rem; color: var(--ink-mute); }
  .toast .icon { color: var(--sunshine); width: 1.35rem; height: 1.35rem; }
  @keyframes slide { from { opacity: 0; transform: translateX(18px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }

  @media (max-width: 62rem) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: 16.5rem; z-index: 50;
      transform: translateX(-101%); transition: transform .25s ease;
      box-shadow: var(--shadow-2);
    }
    .sidebar.open { transform: none; }
    .menu-btn { display: grid; place-items: center; }
    .scrim { position: fixed; inset: 0; background: rgba(7,16,34,.5); z-index: 45; }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    p: { sprouts:blank(), builders:blank(), founders:blank(), ceos:blank() }
  };

  const KEY = "little-founders-v2";
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (parsed && parsed.p && parsed.p.sprouts) state = Object.assign(state, parsed);
    } catch (e) {}
  }

  const tier = () => TIERS.find(t => t.id === state.tier);
  const prog = () => state.p[state.tier];
  const sessionCount = m => m.s[state.tier].length;
  const key = (n, i) => n + ":" + i;
  const isDone = (n, i) => !!prog().done[key(n, i)];
  const doneIn = m => m.s[state.tier].reduce((a, _, i) => a + (isDone(m.n, i) ? 1 : 0), 0);
  const moduleComplete = m => doneIn(m) === sessionCount(m);
  const allComplete = () => MODULES.every(moduleComplete);

  function points() {
    const p = prog();
    let t = Object.keys(p.done).length * PTS.session;
    t += Object.keys(p.badges).length * PTS.badge;
    t += Object.keys(p.events).length * PTS.event;
    if (p.cert) t += PTS.cert;
    return t;
  }

  function unlocked(m) {
    const done = n => moduleComplete(MODULES[n - 1]);
    if (m.n <= 5) return { ok:true, reqs:[] };
    if (m.n === 6) {
      const first5 = [1,2,3,4,5].every(done), pts = points();
      return { ok: first5 && pts >= GATE_POINTS, reqs:[
        { label:"Courses 1–5 complete", met:first5 },
        { label:"Earn " + GATE_POINTS + " Little Points (" + pts + "/" + GATE_POINTS + ")", met: pts >= GATE_POINTS }
      ]};
    }
    if (m.n === 9) {
      const first8 = [1,2,3,4,5,6,7,8].every(done);
      const b1 = !!prog().badges["Money Smart"], b2 = !!prog().badges["I Can Pitch!"];
      return { ok: first8 && b1 && b2, reqs:[
        { label:"Courses 1–8 complete", met:first8 },
        { label:"Money Smart badge", met:b1 },
        { label:"I Can Pitch! badge", met:b2 }
      ]};
    }
    const prev = MODULES[m.n - 2], ok = moduleComplete(prev);
    return { ok, reqs:[{ label: prev.name + " complete", met: ok }] };
  }

  const currentModule = () => MODULES.find(m => unlocked(m).ok && !moduleComplete(m)) || MODULES[MODULES.length - 1];

  function overallPct() {
    const total = MODULES.reduce((a, m) => a + sessionCount(m), 0);
    return Math.round(Object.keys(prog().done).length / total * 100);
  }

  function streak() {
    let n = 0;
    for (const m of MODULES) {
      for (let i = 0; i < sessionCount(m); i++) {
        if (isDone(m.n, i)) n++; else return n;
      }
    }
    return n;
  }

  /* ============================ helpers ============================ */

  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const ico = (id, cls) => '<svg class="icon ' + (cls || "") + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const paint = c => "background:var(--" + c + ");color:var(--on-" + c + ")";

  function toast(title, body, icon) {
    const t = el("div", "toast", ico(icon || "i-star") + "<div><b>" + esc(title) + "</b><span>" + esc(body) + "</span></div>");
    document.getElementById("toasts").appendChild(t);
    setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = "0"; setTimeout(() => t.remove(), 320); }, 3600);
  }

  function bump(id) {
    const n = document.getElementById(id);
    if (!n) return;
    n.classList.remove("bump"); void n.offsetWidth; n.classList.add("bump");
  }

  /* ============================ actions ============================ */

  function toggleSession(m, i) {
    const p = prog(), k = key(m.n, i), was = moduleComplete(m);
    if (p.done[k]) delete p.done[k]; else p.done[k] = 1;
    const now = moduleComplete(m);

    if (now && !was) {
      if (!p.badges[m.badge]) { p.badges[m.badge] = 1; toast(m.badge + " earned!", "+" + PTS.badge + " Little Points", "i-medal"); }
      if (m.milestone && !p.events[m.milestoneName]) { p.events[m.milestoneName] = 1; toast(m.milestoneName + " complete", "+" + PTS.event + " Little Points", "i-rocket"); }
      const next = MODULES[m.n];
      if (next && unlocked(next).ok) toast(next.name + " unlocked", "Course " + next.n + " is open", "i-map");
      if (allComplete() && !p.cert) { p.cert = 1; toast(tier().cert + "!", "All ten courses complete", "i-trophy"); }
    }
    if (!now && was) {
      delete p.badges[m.badge];
      if (m.milestone) delete p.events[m.milestoneName];
      p.cert = 0;
    }

    bump("pointsMeter"); save(); render();
  }

  function toggleBadge(name) {
    const p = prog();
    if (p.badges[name]) delete p.badges[name];
    else { p.badges[name] = 1; toast(name + " awarded", "+" + PTS.badge + " Little Points", "i-medal"); }
    bump("pointsMeter"); save(); render();
  }

  function go(view, mod) {
    state.view = view;
    if (mod !== undefined) state.openModule = mod;
    document.getElementById("sidebar").classList.remove("open");
    const s = document.querySelector(".scrim"); if (s) s.remove();
    save(); render();
    window.scrollTo({ top: 0 });
  }

      '<p class="muted">' + (pct === 0 ? "Start with Idea Starter — find something that bugs you."

    c1.appendChild(rw);

    const bars = el("div", "bars");
    bars.style.marginTop = "1rem";
    MODULES.slice(0, 5).forEach(m => {
      const p = Math.round(doneIn(m) / sessionCount(m) * 100);
      bars.appendChild(el("div", "bar-row",
        ico(m.icon) +
        '<div class="bar-label"><b>' + esc(m.name) + '</b><div class="bar"><i style="width:' + p + '%;background:var(--' + m.colour + ')"></i></div></div>' +
        '<em>' + p + '%</em>'));
    });
    c1.appendChild(bars);
    grid.appendChild(c1);

    const c2 = el("div", "card");
    const cp = Math.round(doneIn(cur) / sessionCount(cur) * 100);
    c2.innerHTML =
      '<header><h2>Current Course</h2></header>' +
      '<div style="display:flex;gap:.8rem;align-items:center">' +
        '<div class="badge-medal" style="' + paint(cur.colour) + '">' + ico(cur.icon) + '</div>' +
        '<div><h3>' + esc(cur.name) + '</h3><span class="muted">' + esc(cur.big) + '</span></div>' +
      '</div>' +
      '<div class="bar" style="margin:1rem 0 .5rem"><i style="width:' + cp + '%;background:var(--' + cur.colour + ')"></i></div>' +
      '<p class="muted">' + doneIn(cur) + ' of ' + sessionCount(cur) + ' sessions · earns the <b>' + esc(cur.badge) + '</b> badge</p>' +
      '<button class="btn" style="margin-top:1rem" data-go="module" data-mod="' + cur.n + '">Continue learning</button>';
    grid.appendChild(c2);

    const c3 = el("div", "card");
    const dayNames = ["1","2","3","4","5","6","7"];
    let days = "";
    for (let i = 0; i < 7; i++) {
      const on = i < Math.min(st, 7);
      days += '<div class="day"><div class="dot' + (on ? " on" : "") + '">' + (on ? ico("i-check") : "") + '</div>' + dayNames[i] + '</div>';
    }
    c3.innerHTML =
      '<header><h2>Learning Streak</h2></header>' +
      '<div class="streak-num">' + ico("i-flame") + st + '</div>' +
      '<p class="muted" style="margin-top:.3rem">sessions in a row, no gaps</p>' +
      '<div class="days">' + days + '</div>' +
      '<p class="muted" style="margin-top:.9rem">' + (st >= 7 ? "Streak Star territory — ask your Guide to award it." : "Seven in a row earns Streak Star.") + '</p>';
    grid.appendChild(c3);

    v.appendChild(grid);

    const grid2 = el("div", "grid g-2");

    // certification
    const done10 = MODULES.filter(moduleComplete).length;
    const c4 = el("div", "card");
    c4.innerHTML = '<header><h2>Certification</h2><span class="muted">' + done10 + ' / 10 courses</span></header>';
    const cert = el("div", "cert" + (prog().cert ? " earned" : ""));
    cert.innerHTML =
      '<div class="cert-seal" style="' + (prog().cert ? paint(t.colour) : "") + '">' + ico(prog().cert ? "i-trophy" : "i-lock") + '</div>' +
      '<b>' + esc(t.cert) + '</b>' +
      '<p class="muted">' + (prog().cert
        ? "Awarded at Demo Day. " + esc(t.name) + " complete."
        : "Awarded at Demo Day when all ten courses are complete, with a portfolio.") + '</p>';
    c4.appendChild(cert);
    grid2.appendChild(c4);

    // next locked
    const nextLocked = MODULES.find(m => !unlocked(m).ok);
    const c5 = el("div", "card");
    if (nextLocked) {
      const u = unlocked(nextLocked);
      c5.innerHTML = '<header><h2>What\'s next?</h2></header>' +
        '<p style="margin-bottom:.8rem"><b>' + esc(nextLocked.name) + '</b> is locked. To open it:</p>';
      const ul = el("ul", "req");
      u.reqs.forEach(r => ul.appendChild(el("li", null, ico(r.met ? "i-check" : "i-lock", r.met ? "met" : "unmet") + esc(r.label))));
      c5.appendChild(ul);
    } else {
      c5.innerHTML = '<header><h2>Badges</h2><button class="btn ghost small" data-go="badges">See all</button></header>';
      const bg = el("div", "badge-grid");
      const show = BADGES.filter(b => prog().badges[b.name]).slice(-4);
      if (!show.length) c5.appendChild(el("p", "muted", "No badges yet. Finish all the sessions in a course to earn its badge."));
      else { show.forEach(b => bg.appendChild(badgeCard(b, true))); c5.appendChild(bg); }
    }
    grid2.appendChild(c5);
    v.appendChild(grid2);
  }

  function viewMap() {
    const v = document.getElementById("view");
    const layout = el("div", "map-layout"), map = el("div", "map"), cur = currentModule();

    const d = NODE_POS.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
    const doneCount = MODULES.filter(moduleComplete).length;
    const dDone = NODE_POS.slice(0, Math.max(doneCount, 1)).map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
    map.innerHTML =
      '<svg class="map-bg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
        '<path class="map-path" d="' + d + '" vector-effect="non-scaling-stroke"/>' +
        (doneCount > 1 ? '<path class="map-path done" d="' + dDone + '" vector-effect="non-scaling-stroke"/>' : "") +
      '</svg>';

    MODULES.forEach((m, idx) => {
      const u = unlocked(m), complete = moduleComplete(m), isCur = m.n === cur.n && !complete;
      const node = el("div", "node" + (u.ok ? "" : " is-locked") + (isCur ? " is-current" : ""));
      node.style.left = NODE_POS[idx][0] + "%";
      node.style.top = NODE_POS[idx][1] + "%";
      const stars = Math.round(doneIn(m) / sessionCount(m) * 3);
      let starHtml = "";
      for (let i = 0; i < stars; i++) starHtml += ico("i-star");
      node.innerHTML =
        '<button class="node-btn" style="' + (u.ok ? paint(m.colour) : "") + '" data-go="module" data-mod="' + m.n + '" ' +
          'aria-label="Course ' + m.n + ', ' + esc(m.name) + (u.ok ? "" : ", locked") + '">' +
          ico(u.ok ? m.icon : "i-lock") + '<span class="node-num">' + m.n + '</span>' +
        '</button>' +
        '<span class="node-name">' + esc(m.name) + '</span>' +
        (starHtml ? '<span class="node-stars">' + starHtml + '</span>' : "");
      map.appendChild(node);
    });
    layout.appendChild(map);

    const target = MODULES.find(m => !unlocked(m).ok) || cur;
    const u = unlocked(target);
    const panel = el("div", "panel");
    const head = el("div", "panel-head");
    head.setAttribute("style", u.ok ? paint(target.colour) : "background:var(--surface-3);color:var(--ink)");
    head.innerHTML =
      '<span class="kicker">Course ' + target.n + (u.ok ? "" : " · Locked") + '</span>' +
      '<h2>' + esc(target.name) + '</h2><p>' + esc(target.big) + '</p>';
    panel.appendChild(head);

    const card = el("div", "card");
    if (u.ok) {
      card.innerHTML = '<header><h2>Where you are</h2></header>' +
        '<p class="muted">' + doneIn(target) + ' of ' + sessionCount(target) + ' sessions complete. Finishing them all earns the <b>' + esc(target.badge) + '</b> badge.</p>' +
        '<button class="btn" style="margin-top:1rem" data-go="module" data-mod="' + target.n + '">Open course</button>';
    } else {
      card.innerHTML = '<header><h2>How to unlock</h2></header>';
      const ul = el("ul", "req");
      u.reqs.forEach(r => ul.appendChild(el("li", null, ico(r.met ? "i-check" : "i-lock", r.met ? "met" : "unmet") + esc(r.label))));
      card.appendChild(ul);
    }
    panel.appendChild(card);

    const legend = el("div", "card");
    legend.innerHTML = '<header><h2>Your map</h2></header>' +
      '<p class="muted">' + MODULES.filter(moduleComplete).length + ' of 10 courses · ' +
      Object.keys(prog().badges).length + ' of 27 badges · ' + points() + ' Little Points. ' +
      'Stars show how far through each course you are.</p>';
    panel.appendChild(legend);

    layout.appendChild(panel);
    v.appendChild(layout);
  }

  function viewModule() {
    const v = document.getElementById("view");
    const m = MODULES.find(x => x.n === state.openModule) || MODULES[0];
    const u = unlocked(m), t = tier();

    const back = el("button", "btn ghost small", ico("i-back") + "Learning Map");
    back.dataset.go = "map";
    back.style.justifySelf = "start";
    v.appendChild(back);

    const head = el("div", "panel-head");
    head.setAttribute("style", u.ok ? paint(m.colour) : "background:var(--surface-3);color:var(--ink)");
    head.innerHTML =
      '<span class="kicker">Course ' + m.n + ' · ' + esc(t.name) + ' · ' + sessionCount(m) + ' sessions of ' + t.mins + ' min</span>' +
      '<h2>' + esc(m.name) + '</h2><p>' + esc(m.big) + '</p>';
    v.appendChild(head);

    if (!u.ok) {
      const card = el("div", "card");
      card.innerHTML = '<header><h2>Locked</h2></header><p class="muted" style="margin-bottom:.8rem">Finish these first — the sequence exists so nobody prices something before Money Smarts, or sells to strangers before Pitch Like a Pro.</p>';
      const ul = el("ul", "req");
      u.reqs.forEach(r => ul.appendChild(el("li", null, ico(r.met ? "i-check" : "i-lock", r.met ? "met" : "unmet") + esc(r.label))));

      v.appendChild(card);

    const list = el("div", "sessions");

        '<button class="check" aria-pressed="' + done + '" aria-label="' + (done ? "Mark session " + (i + 1) + " not done" : "Mark session " + (i + 1) + " complete") + '" data-sess="' + i + '">' + ico("i-check") + '</button>';

    const complete = moduleComplete(m);
    const foot = el("div", "card");
    foot.innerHTML =
      '<header><h2>Badge</h2></header>' +
      '<div style="display:flex;gap:.9rem;align-items:center">' +
        '<div class="badge-medal" style="' + (complete ? paint("energy") : "") + '">' + ico("i-medal") + '</div>' +
        '<div><h3>' + esc(m.badge) + '</h3><span class="muted">' +
          (complete ? "Earned — +" + PTS.badge + " Little Points" : "Complete all " + sessionCount(m) + " sessions to earn this") +
        '</span></div>' +
      '</div>';
    v.appendChild(foot);
  }

    c.innerHTML = '<div class="badge-medal">' + ico(earned ? (b.core ? "i-medal" : "i-star") : "i-lock") + '</div>' +

          c.appendChild(btn);

        if (b) toggleBadge(b.dataset.badge);

      card.appendChild(grid);
      v.appendChild(card);

  }

  /* ============================ render ============================ */

  function renderNav() {
    const nav = document.getElementById("nav");
    nav.innerHTML = "";
    NAV.forEach(n => {
      const b = el("button", "nav-btn", ico(n.icon) + n.label);
      b.dataset.go = n.id;
      if (state.view === n.id || (state.view === "module" && n.id === "courses")) b.setAttribute("aria-current", "page");
      nav.appendChild(b);
    });

    const tr = document.getElementById("tierRow");
    tr.innerHTML = "";
    TIERS.forEach(t => {
      const b = el("button", "tier-btn",
        '<span class="tier-top-row"><span class="tier-dot" style="background:var(--' + t.colour + ')"></span>' + t.short + '</span>' +
        '<span class="tier-age">' + t.age + '</span>');
      b.setAttribute("aria-pressed", String(state.tier === t.id));
      b.title = t.name + " — " + t.promise;
      b.addEventListener("click", () => {
        state.tier = t.id;
        state.openModule = null;
        if (state.view === "module") state.view = "courses";
        save(); render();
      });
      tr.appendChild(b);
    });
  }

  const TITLES = { dashboard:"My Progress", map:"Learning Map", courses:"My Courses", badges:"Badges", module:"My Courses" };

  function render() {
    renderNav();
    document.getElementById("viewTitle").textContent = TITLES[state.view] || "Little Founders";
    document.getElementById("pointsVal").textContent = points();
    document.getElementById("streakVal").textContent = streak();
    const v = document.getElementById("view");
    v.innerHTML = "";
    ({ dashboard:viewDashboard, map:viewMap, courses:viewCourses, module:viewModule, badges:viewBadges }[state.view] || viewDashboard)();
  }

  /* ============================ wiring ============================ */

  document.addEventListener("click", e => {
    const g = e.target.closest("[data-go]");
    if (g) go(g.dataset.go, g.dataset.mod ? +g.dataset.mod : undefined);
  });

  document.getElementById("menuBtn").addEventListener("click", () => {
    const sb = document.getElementById("sidebar");
    sb.classList.add("open");
    const scrim = el("div", "scrim");
    scrim.addEventListener("click", () => { sb.classList.remove("open"); scrim.remove(); });
    document.body.appendChild(scrim);
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    state.p[state.tier] = blank();
    state.openModule = null;
    save(); render();
    toast("Progress reset", tier().name + " is back to the start", "i-back");
  });

  load();
  render();
})();
</script>
