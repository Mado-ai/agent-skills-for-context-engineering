<!--
  Netlify Forms detection stub.

  Netlify discovers forms by parsing static HTML at deploy time. Because this
  site renders the real contact form with React (Next.js App Router), the build
  bot never sees it — so we declare the form's shape here once. The live React
  form in src/components/ContactForm.tsx POSTs to this file's path.

  Keep the field names in sync with ContactForm.tsx.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Netlify form detection</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input type="email" name="email" />
      <input name="company" />
      <input name="market" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
